<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神經矩陣 MAXIMA | V12.0 激進進攻引擎</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-deep: #05070a;
            --panel-bg: rgba(10, 15, 20, 0.95);
            --holo-cyan: #00e5ff;
            --apex-gold: #ffc800;
            --aggressive-red: #ff0044;
            --pure-white: #f0f5fa;
            --muted-gold: #826a4a;
            --grid: rgba(255, 0, 68, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-deep);
            color: var(--pure-white);
            font-family: 'Share Tech Mono', 'Microsoft JhengHei', sans-serif;
            height: 100vh; display: flex; overflow: hidden;
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .layout-grid { display: grid; grid-template-columns: 320px 1fr 320px; gap: 20px; width: 100%; height: 100%; padding: 20px; }
        .panel { background: var(--panel-bg); border: 1px solid rgba(255, 0, 68, 0.2); position: relative; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
        .panel-header { padding: 12px; border-bottom: 1px solid var(--aggressive-red); font-family: 'Orbitron'; font-size: 11px; letter-spacing: 2px; display: flex; justify-content: space-between; background: rgba(255,0,68,0.1); }
        
        .ncr-display { padding: 25px; text-align: center; border-bottom: 1px solid rgba(255, 0, 68, 0.1); }
        .ncr-value { font-family: 'Orbitron'; font-size: 64px; font-weight: 900; color: var(--aggressive-red); text-shadow: 0 0 30px rgba(255, 0, 68, 0.5); }
        
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
        .metric-node { background: rgba(255,0,68,0.02); border: 1px solid rgba(255, 0, 68, 0.1); padding: 12px; opacity: 0; transform: translateY(10px); transition: 0.5s; }
        .metric-node.visible { opacity: 1; transform: translateY(0); }
        .mn-title { font-size: 10px; color: var(--aggressive-red); margin-bottom: 5px; font-weight: bold; }
        .mn-val { font-family: 'Orbitron'; font-size: 22px; color: var(--pure-white); }
        .mn-val.highlight { color: var(--aggressive-red); text-shadow: 0 0 10px var(--aggressive-red); }

        .charts-container { display: grid; grid-template-columns: 1fr; gap: 15px; flex: 1; padding: 15px; }
        .chart-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(255, 0, 68, 0.05); position: relative; flex: 1; }

        .report-box { padding: 20px; font-size: 13px; line-height: 1.8; color: #ccc; background: rgba(255,0,68,0.05); border-top: 1px solid rgba(255,0,68,0.2); }
        .hl { color: var(--aggressive-red); font-weight: bold; }

        input, button { background: #000; border: 1px solid var(--aggressive-red); color: var(--aggressive-red); padding: 12px; font-family: 'Share Tech Mono'; width: 100%; margin-bottom: 15px; font-size: 14px; }
        button { cursor: pointer; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; }
        button:hover { background: var(--aggressive-red); color: #fff; box-shadow: 0 0 20px var(--aggressive-red); }
        
        .term-log { flex: 1; padding: 15px; font-size: 11px; color: #666; overflow-y: auto; font-family: 'Share Tech Mono'; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="layout-grid">
        <div class="panel">
            <div class="panel-header"><span>SUBJECT_IDENT</span><span>AGGRESSIVE_V12</span></div>
            <div class="ncr-display">
                <div id="ui-name" style="font-size: 18px; margin-bottom: 10px; font-family: 'Orbitron'; letter-spacing: 1px;">---</div>
                <div id="ui-ncr" class="ncr-value">0.00</div>
                <div id="ui-class" style="font-size: 11px; color: var(--aggressive-red); margin-top: 10px; font-weight: bold;">STANDBY</div>
            </div>
            <div class="term-log" id="ui-log">> 初始化激進運算模組...<br>> 權重已重置為 Killer-Instinct 模式。</div>
        </div>

        <div class="panel">
            <div class="panel-header"><span>OFFENSIVE_EXTREMITY_ANALYSIS</span><span>RADAR_SYNC</span></div>
            <div class="charts-container">
                <div class="chart-box"><canvas id="radarChart"></canvas></div>
            </div>
            <div class="metrics-grid">
                <div class="metric-node" id="node-1"><div class="mn-title">激進進攻(STR)</div><div class="mn-val highlight" id="val-str">0</div></div>
                <div class="metric-node" id="node-2"><div class="mn-title">防禦係數(DEF)</div><div class="mn-val" id="val-def">0</div></div>
                <div class="metric-node" id="node-3"><div class="mn-title">微操精度(MIC)</div><div class="mn-val" id="val-mic">0</div></div>
                <div class="metric-node" id="node-4"><div class="mn-title">宏觀營運(MAC)</div><div class="mn-val" id="val-mac">0</div></div>
                <div class="metric-node" id="node-5"><div class="mn-title">抗壓心理(PSY)</div><div class="mn-val" id="val-psy">0</div></div>
                <div class="metric-node" id="node-6"><div class="mn-title">穩定指數(CST)</div><div class="mn-val" id="val-cst">0</div></div>
            </div>
            <div class="report-box" id="ui-report">請注入數據，系統將執行非線性進攻壓制運算。</div>
        </div>

        <div class="panel">
            <div class="panel-header"><span>COMMAND_CONSOLE</span><span>OVERRIDE</span></div>
            <div style="padding: 20px;">
                <label style="font-size: 10px; color: var(--aggressive-red); font-weight: bold;">TARGET_PLAYER_TAG</label>
                <input type="text" id="playerTag" value="#CV9QU9CYJ">
                <button onclick="executeAggressiveAnalysis()">執行激進數據解構</button>
            </div>
            <div style="padding: 0 20px; font-size: 10px; color: #555;">
                * 警告：激進版本會大幅壓低非三冠傾向玩家的 STR 分數。
            </div>
        </div>
    </div>

    <script>
        let radarChart;

        function initCharts() {
            const ctxR = document.getElementById('radarChart').getContext('2d');
            radarChart = new Chart(ctxR, {
                type: 'radar',
                data: {
                    labels: ['STR (激進)', 'DEF', 'MIC', 'MAC', 'PSY', 'CST'],
                    datasets: [{ 
                        data: [0,0,0,0,0,0], 
                        backgroundColor: 'rgba(255, 0, 68, 0.15)', 
                        borderColor: '#ff0044', 
                        borderWidth: 2,
                        pointBackgroundColor: '#fff',
                        pointRadius: 2
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    scales: { 
                        r: { 
                            grid: { color: 'rgba(255,0,68,0.1)' }, 
                            angleLines: { color: 'rgba(255,0,68,0.1)' }, 
                            ticks: { display: false },
                            pointLabels: { color: '#ff0044', font: { size: 10, weight: 'bold' } }
                        } 
                    }, 
                    plugins: { legend: { display: false } } 
                }
            });
        }

        async function executeAggressiveAnalysis() {
            const tag = document.getElementById('playerTag').value;
            const log = document.getElementById('ui-log');
            log.innerHTML += `<br>> 鎖定目標: ${tag}`;
            
            // 模擬高端進攻型玩家
            const data = {
                name: "OFFENSIVE_BEAST",
                wins: 12000,
                losses: 9500,
                bestTrophies: 8600,
                threeCrownWins: 5800 // 極高三冠數
            };

            const total = data.wins + data.losses;
            const wr = data.wins / total;
            const pb = data.bestTrophies;
            const tcw = data.threeCrownWins;

            // ==========================================
            // 🔥 V12.0 激進版本 STR 核心算法
            // ==========================================
            
            // 1. 核心轉換率 (權重 65%): 使用平方提升高分段差異
            const rawConvRate = (tcw / data.wins);
            const convScore = Math.pow(rawConvRate, 0.85) * 100; // 略微補償中段，但極大化高段

            // 2. 盃段難度 (權重 20%): 必須在高盃段達成才算數
            const difficulty = (pb / 9000) * 100;

            // 3. 進攻純度 (權重 15%): 三冠在總對局中的存在感
            const purity = (tcw / total) * 100;

            // 激進合成公式
            let str = (convScore * 0.65) + (difficulty * 0.20) + (purity * 0.15);
            
            // 激進補償：如果勝率高且三冠率高，給予額外 15% 爆發獎勵
            if (rawConvRate > 0.4 && wr > 0.55) str *= 1.15;

            str = Math.min(100, str);

            // 其他指標 (輔助)
            let def = Math.min(100, ((data.wins - tcw)/data.wins * 60) + (wr * 40));
            let mic = Math.min(100, (pb / 9000 * 40) + ( (1 - rawConvRate) * wr * 120 ) );
            let mac = Math.min(100, (pb / 9000 * 60) + (wr * 40));
            let psy = Math.min(100, (pb > 8000 ? 95 : pb/100) + (wr * 5));
            let cst = Math.min(100, (Math.log10(total) / Math.log10(80000)) * 100);

            const scores = [str, def, mic, mac, psy, cst];
            
            // UI 更新
            document.getElementById('ui-name').innerText = data.name;
            const ids = ['val-str', 'val-def', 'val-mic', 'val-mac', 'val-psy', 'val-cst'];
            ids.forEach((id, i) => {
                document.getElementById(id).innerText = Math.round(scores[i]);
                document.getElementById(`node-${i+1}`).classList.add('visible');
            });

            radarChart.data.datasets[0].data = scores;
            radarChart.update();

            // MVI 指數 (幾何面積權重)
            const mvi = (scores.reduce((a, b) => a + b) / 600) * 100;
            document.getElementById('ui-ncr').innerText = mvi.toFixed(2);
            document.getElementById('ui-class').innerText = mvi > 75 ? "危險掠食者" : "標準作戰單位";

            document.getElementById('ui-report').innerHTML = `
                <span class="hl">激進進攻評定:</span> 該對象表現出 <span class="hl">${(rawConvRate*100).toFixed(1)}%</span> 的斬殺轉換率。
                在 V12 激進算法下，其 STR 指數被判定為 <span class="hl">${Math.round(str)}</span>。
                這意味著該玩家不具備妥協性，其戰術核心完全建立在<span class="hl">摧毀對方主塔</span>而非點數勝出。
            `;
            
            log.innerHTML += `<br>> 運算完成。檢測到高強度攻擊訊號。`;
        }

        window.onload = initCharts;
    </script>
</body>
</html>
