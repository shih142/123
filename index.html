<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MAXIMA 12D - 核心掃描</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --neon: #00f2ff; --bg: #0a0b10; }
        body { background: var(--bg); color: var(--neon); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .box { background: #161822; padding: 40px; border-radius: 20px; border: 1px solid var(--neon); width: 450px; text-align: center; box-shadow: 0 0 20px rgba(0,242,255,0.2); }
        input { background: #000; border: 1px solid var(--neon); color: #fff; padding: 12px; width: 60%; border-radius: 8px; outline: none; }
        button { background: var(--neon); color: #000; border: none; padding: 12px 25px; cursor: pointer; font-weight: bold; border-radius: 8px; margin-left: 5px; }
        #status { margin: 20px 0; font-size: 0.85rem; color: #888; min-height: 1.5em; }
        canvas { margin-top: 20px; }
    </style>
</head>
<body>

<div class="box">
    <h1 style="letter-spacing: 5px;">MAXIMA 12D</h1>
    <p style="font-size: 0.7rem; color: #bc13fe; margin-bottom: 30px;">REAL-TIME DATA ANALYSIS</p>
    
    <div style="display:flex; justify-content:center;">
        <input type="text" id="playerTag" placeholder="例如 #P8RR2P" value="#P8RR2P">
        <button onclick="runScan()">SCAN</button>
    </div>

    <div id="status">系統等待指令...</div>
    <canvas id="radarChart"></canvas>
</div>

<script>
    let myChart = null;

    async function runScan() {
        const tagInput = document.getElementById('playerTag').value.trim();
        const status = document.getElementById('status');
        
        if (!tagInput) return alert("請輸入 Tag");

        status.innerText = "📡 正在解析數據模式...";
        status.style.color = "var(--neon)";

        try {
            // 💡 關鍵修復：清理掉 #，並使用 URLSearchParams 確保網址模式正確
            const cleanTag = tagInput.replace('#', '');
            const params = new URLSearchParams({ tag: cleanTag });
            
            const response = await fetch(`/api/clash-proxy?${params.toString()}`);
            const data = await response.json();

            if (!response.ok) throw new Error(data.message || "連線請求被拒絕");

            status.innerText = `✅ 玩家已鎖定: ${data.name}`;
            
            // 計算雷達圖指標 (模擬 12D 指標)
            const metrics = [
                Math.min(100, (data.avgTowerHP / 8500) * 100), // DEF
                data.winRate,                                 // ATK
                88, 75, 60, 95, 70, 82, 65, 90, 78, 85        // 預設/隨機
            ];
            
            drawChart(metrics);

        } catch (err) {
            status.innerText = `❌ 錯誤: ${err.message}`;
            status.style.color = "#ff4444";
            console.error("Pattern Error Debug:", err);
        }
    }

    function drawChart(vals) {
        const ctx = document.getElementById('radarChart');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['DEF', 'ATK', 'SKL', 'CRT', 'END', 'CLT', 'SPD', 'ACC', 'LUK', 'INT', 'AGI', 'STA'],
                datasets: [{
                    data: vals,
                    borderColor: '#00f2ff',
                    backgroundColor: 'rgba(0, 242, 255, 0.2)',
                    pointBackgroundColor: '#bc13fe'
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: {
                    r: {
                        grid: { color: 'rgba(255,255,255,0.1)' },
                        angleLines: { color: 'rgba(255,255,255,0.1)' },
                        ticks: { display: false },
                        suggestedMax: 100,
                        suggestedMin: 0
                    }
                }
            }
        });
    }
</script>
</body>
</html>
