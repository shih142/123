<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMA 12D | 戰術人格掃描儀</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff;
            --purple: #bc13fe;
            --bg: #0a0b10;
        }
        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Orbitron', sans-serif, "Microsoft JhengHei";
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background: linear-gradient(145deg, #161822, #0d0e14);
            border: 1px solid var(--neon);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
            text-align: center;
        }
        h1 { color: var(--neon); letter-spacing: 4px; margin-bottom: 5px; }
        .search-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 25px 0;
        }
        input {
            background: #000;
            border: 1px solid #333;
            color: var(--neon);
            padding: 12px;
            border-radius: 8px;
            width: 180px;
            outline: none;
            text-align: center;
        }
        input:focus { border-color: var(--neon); }
        button {
            background: var(--neon);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { box-shadow: 0 0 15px var(--neon); transform: scale(1.05); }
        #status {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 15px;
            min-height: 1.2em;
        }
        canvas { margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>MAXIMA 12D</h1>
        <div id="status">系統就緒，請輸入玩家標籤</div>

        <div class="search-group">
            <input type="text" id="playerTag" placeholder="#P8RR2P" value="#P8RR2P">
            <button onclick="startScan()">啟動掃描</button>
        </div>

        <canvas id="radarChart"></canvas>
    </div>

    <script>
        let myChart = null;

        async function startScan() {
            const tagInput = document.getElementById('playerTag').value.trim();
            const status = document.getElementById('status');
            
            if (!tagInput) {
                status.innerText = "⚠️ 請輸入玩家 Tag";
                return;
            }

            status.innerText = "📡 正在分析數據模式...";
            status.style.color = "var(--neon)";

            try {
                // 1. 預防 Pattern 錯誤：過濾非英數，強制大寫
                const cleanTag = tagInput.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
                
                // 2. 使用 URL 建構子確保 URL 模式絕對正確
                const apiUrl = new URL('/api/clash-proxy', window.location.origin);
                apiUrl.searchParams.set('tag', cleanTag);

                const response = await fetch(apiUrl.toString());
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "數據擷取失敗");
                }

                status.innerText = `✅ 鎖定對象: ${data.name}`;
                
                // 將後端回傳的數據對應到 12D 指標
                const metrics = [
                    Math.min(100, (data.avgTowerHP / 8500) * 100), // DEF
                    data.winRate,                                 // ATK
                    85, 70, 65, 90, 75, 80, 60, 88, 72, 85        // 預設維度
                ];

                updateChart(metrics);

            } catch (err) {
                console.error("Fetch Error:", err);
                status.innerText = `❌ 錯誤: ${err.message}`;
                status.style.color = "#ff4444";
            }
        }

        function updateChart(dataPoints) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['DEF', 'ATK', 'SKL', 'CRT', 'END', 'CLT', 'SPD', 'ACC', 'LUK', 'INT', 'AGI', 'STA'],
                    datasets: [{
                        data: dataPoints,
                        backgroundColor: 'rgba(0, 242, 255, 0.2)',
                        borderColor: '#00f2ff',
                        borderWidth: 2,
                        pointBackgroundColor: '#bc13fe'
                    }]
                },
                options: {
                    scales: {
                        r: {
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            angleLines: { color: 'rgba(255,255,255,0.1)' },
                            pointLabels: { color: '#888', font: { size: 10 } },
                            ticks: { display: false },
                            suggestedMin: 0,
                            suggestedMax: 100
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
    </script>
</body>
</html>
