<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神經矩陣 MAXIMA | V10.0 個人價值與微操</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-deep: #0a0805;
            --panel-bg: rgba(20, 15, 10, 0.85);
            --holo-cyan: #00e5ff;
            --apex-gold: #ffc800;
            --pure-white: #f0f5fa;
            --muted-gold: #826a4a;
            --grid: rgba(255, 200, 0, 0.05);
            --danger-red: #ff3366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--apex-gold); }

        body {
            background-color: var(--bg-deep);
            color: var(--pure-white);
            font-family: 'Share Tech Mono', 'Microsoft JhengHei', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,200,0,0.05), transparent 60%),
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .layout-grid { display: grid; grid-template-columns: 320px 1fr 320px; gap: 20px; width: 100%; height: 100%; padding: 20px; z-index: 10; }

        .panel { background: var(--panel-bg); border: 1px solid var(--muted-gold); backdrop-filter: blur(10px); display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);}
        .panel-header { padding: 12px 15px; border-bottom: 1px solid var(--muted-gold); font-family: 'Orbitron', 'Microsoft JhengHei'; font-size: 12px; color: var(--pure-white); letter-spacing: 2px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.6); font-weight: bold;}
        .panel-header span:last-child { color: var(--apex-gold); font-weight: normal; text-shadow: 0 0 5px var(--apex-gold);}

        .profile-card { padding: 20px; text-align: center; }
        .avatar-box { width: 100px; height: 100px; border: 2px solid var(--apex-gold); margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; font-size: 40px; background: rgba(255,200,0,0.05); transform: rotate(45deg); box-shadow: 0 0 15px rgba(255,200,0,0.2);}
        .avatar-box span { transform: rotate(-45deg); display: block; }
        .p-name { font-family: 'Orbitron'; font-size: 24px; color: var(--pure-white); font-weight: bold; text-transform: uppercase; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255,200,0,0.5);}
        .p-tag { color: var(--muted-gold); font-size: 12px; }

        .ncr-display { margin-top: 20px; padding: 20px; border: 1px solid var(--apex-gold); background: rgba(0,0,0,0.6); position: relative; box-shadow: inset 0 0 30px rgba(255,200,0,0.1);}
        .ncr-title { font-size: 11px; color: var(--apex-gold); margin-bottom: 10px; font-weight: bold; letter-spacing: 1px;}
        .ncr-value { font-family: 'Orbitron'; font-size: 60px; font-weight: 900; line-height: 1; color: var(--pure-white); text-shadow: 0 0 20px var(--apex-gold);}
        
        .mid-col { display: flex; flex-direction: column; gap: 20px; }
        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 280px; }
        .chart-box { padding: 15px; display: flex; justify-content: center; align-items: center; position: relative; }
        
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .metric-node { background: rgba(10,5,0,0.8); border: 1px solid var(--muted-gold); padding: 15px; display: flex; flex-direction: column; justify-content: space-between; border-top: 3px solid var(--apex-gold); opacity: 0; transform: translateY(10px); transition: all 0.4s ease-out; position: relative;}
        .metric-node.visible { opacity: 1; transform: translateY(0); }
        .metric-node::after { content: ''; position: absolute; bottom: 0; right: 0; width: 20px; height: 20px; background: linear-gradient(135deg, transparent 50%, rgba(255,200,0,0.1) 50%); }
        
        .mn-title { font-size: 11px; color: var(--muted-gold); font-weight: bold; letter-spacing: 1px;}
        .mn-val { font-family: 'Orbitron'; font-size: 24px; font-weight: bold; color: var(--pure-white); margin-top: 8px;}
        .mn-val.highlight { color: var(--holo-cyan); text-shadow: 0 0 10px var(--holo-cyan); }
        .mn-sub { font-size: 10px; color: #888; margin-top: 5px; }

        .report-panel { flex: 1; display: flex; flex-direction: column; background: rgba(25, 20, 5, 0.4); border: 1px solid var(--apex-gold); margin-top: 5px;}
        .report-content { padding: 15px; font-size: 13px; line-height: 1.8; color: #ddd; font-family: 'Microsoft JhengHei'; }
        .hl-gold { color: var(--apex-gold); font-weight: bold; }
        .hl-cyan { color: var(--holo-cyan); font-weight: bold; }

        .right-col { display: flex; flex-direction: column; gap: 20px; }
        .control-form { padding: 20px; }
        .input-group label { display: block; font-size: 11px; color: var(--muted-gold); margin-bottom: 5px; font-weight:bold;}
        .input-group input { width: 100%; background: rgba(0,0,0,0.8); border: 1px solid var(--muted-gold); color: var(--apex-gold); padding: 12px; font-family: 'Share Tech Mono'; margin-bottom: 20px; outline: none; font-size: 14px; transition: 0.3s;}
        .input-group input:focus { border-color: var(--apex-gold); box-shadow: inset 0 0 10px rgba(255,200,0,0.3);}
        
        .btn-exe { width: 100%; background: rgba(255,200,0,0.1); border: 1px solid var(--apex-gold); color: var(--apex-gold); padding: 15px; font-family: 'Microsoft JhengHei'; font-weight: bold; font-size: 14px; letter-spacing: 2px; cursor: pointer; transition: all 0.3s; text-transform: uppercase;}
        .btn-exe:hover { background: var(--apex-gold); color: #000; box-shadow: 0 0 20px rgba(255,200,0,0.6); }
        
        .terminal-panel { flex: 1; display: flex; flex-direction: column; }
        .terminal-screen { flex: 1; padding: 15px; overflow-y: auto; font-size: 12px; line-height: 1.6; color: var(--muted-gold); font-family: 'Share Tech Mono';}
        .log-line { margin-bottom: 4px; opacity: 0; animation: fadeIn 0.1s forwards; }
        .sys-log { color: var(--apex-gold); }
        .sys-mic { color: var(--holo-cyan); }

        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="layout-grid">
        <div class="left-col">
            <div class="panel">
                <div class="panel-header"><span>TARGET_ID</span><span>[ SYNCED ]</span></div>
                <div class="profile-card">
                    <div class="avatar-box"><span>⬡</span></div>
                    <div class="p-name" id="ui-name">AWAITING</div>
                    <div class="p-tag" id="ui-tag">NO_TARGET</div>
                    <div class="ncr-display">
                        <div class="ncr-title">M.V.I (最大化價值指數)</div>
                        <div class="ncr-value" id="ui-ncr">0.00</div>
                        <div style="font-family: 'Microsoft JhengHei'; color: var(--apex-gold); margin-top: 10px; font-size: 13px; font-weight:bold;" id="ui-class">等待幾何展開</div>
                    </div>
                </div>
            </div>
            <div class="panel" style="flex:1;">
                <div class="panel-header"><span>VALUE_TAGS</span><span>[ EXTRACTION ]</span></div>
                <div style="padding: 15px; display: flex; flex-wrap: wrap; gap: 8px;" id="ui-tags"></div>
            </div>
        </div>

        <div class="mid-col">
            <div class="charts-row">
                <div class="panel chart-box">
                    <canvas id="radarChart"></canvas>
                </div>
                <div class="panel chart-box">
                    <canvas id="doughnutChart"></canvas>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header"><span>SIX_PILLARS</span><span>[ V10.0 ]</span></div>
                <div style="padding: 15px;">
                    <div class="metrics-grid">
                        <div class="metric-node" id="node-1"><div class="mn-title">進攻極限(STR)</div><div class="mn-val" id="val-str">0</div><div class="mn-sub">突破能力</div></div>
                        <div class="metric-node" id="node-2"><div class="mn-title">防禦極限(DEF)</div><div class="mn-val" id="val-def">0</div><div class="mn-sub">陣地防護</div></div>
                        <div class="metric-node" id="node-3" style="border-top-color: var(--holo-cyan);"><div class="mn-title">微操精度(MIC)</div><div class="mn-val highlight" id="val-mic">0</div><div class="mn-sub">細節處理</div></div>
                        <div class="metric-node" id="node-4"><div class="mn-title">大局營運(MAC)</div><div class="mn-val" id="val-mac">0</div><div class="mn-sub">節奏控制</div></div>
                        <div class="metric-node" id="node-5"><div class="mn-title">心理韌性(PSY)</div><div class="mn-val" id="val-psy">0</div><div class="mn-sub">抗壓極限</div></div>
                        <div class="metric-node" id="node-6"><div class="mn-title">穩定對數(CST)</div><div class="mn-val" id="val-cst">0</div><div class="mn-sub">實戰經驗</div></div>
                    </div>
                </div>
            </div>
            <div class="panel report-panel">
                <div class="panel-header"><span>MAXIMA_REPORT</span><span>[ AI OPINION ]</span></div>
                <div class="report-content" id="analysis-report">等待數據注入...</div>
            </div>
        </div>

        <div class="right-col">
            <div class="panel control-form">
                <div class="input-group">
                    <label>PROXY_ENDPOINT</label>
                    <input type="text" id="proxyUrl" value="/api/clash-proxy">
                </div>
                <div class="input-group">
                    <label>PLAYER_TAG</label>
                    <input type="text" id="playerTag" value="#CV9QU9CYJ">
                </div>
                <button class="btn-exe" id="btn-run" onclick="initiateMaxima()">注入潛能並解析</button>
            </div>
            <div class="panel terminal-panel">
                <div class="panel-header"><span>SYSTEM_LOG</span><span>[ TRACE ]</span></div>
                <div class="terminal-screen" id="termLog"></div>
            </div>
        </div>
    </div>

    <script>
        Chart.defaults.color = '#826a4a';
        let radarChart, doughnutChart;
        let isProcessing = false;

        function initCharts() {
            const ctxR = document.getElementById('radarChart').getContext('2d');
            const ctxD = document.getElementById('doughnutChart').getContext('2d');
            radarChart = new Chart(ctxR, {
                type: 'radar',
                data: {
                    labels: ['STR', 'DEF', 'MIC', 'MAC', 'PSY', 'CST'],
                    datasets: [{ data: [0,0,0,0,0,0], backgroundColor: 'rgba(255, 200, 0, 0.15)', borderColor: '#ffc800', borderWidth: 2 }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { r: { ticks: { display: false }, grid: { color: 'rgba(255,200,0,0.1)' } } }, plugins: { legend: { display: false } } }
            });
            doughnutChart = new Chart(ctxD, {
                type: 'doughnut',
                data: { labels: ['宏觀', '微觀'], datasets: [{ data: [50, 50], backgroundColor: ['#ffc800', '#00e5ff'] }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { display: false } } }
            });
        }

        async function tLog(msg, type = '') {
            const term = document.getElementById('termLog');
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            term.appendChild(line);
            term.scrollTop = term.scrollHeight;
            line.innerHTML = msg; 
        }

        function resetUI() {
            document.querySelectorAll('.metric-node').forEach(n => n.classList.remove('visible'));
            document.getElementById('ui-tags').innerHTML = '';
            radarChart.data.datasets[0].data = [0,0,0,0,0,0];
            radarChart.update();
        }

        async function initiateMaxima() {
            if(isProcessing) return;
            isProcessing = true;
            resetUI();
            const tag = document.getElementById('playerTag').value;
            await tLog(`> Linking Nexus for ${tag}...`);
            
            // 模擬或獲取數據
            const data = { name: "ACE_TACTICIAN", wins: 15000, losses: 12000, bestTrophies: 8900, threeCrownWins: 2200 };
            
            await runMaximaEngine(data);
            isProcessing = false;
        }

        async function runMaximaEngine(data) {
            document.getElementById('ui-name').innerText = data.name;
            document.getElementById('ui-tag').innerText = document.getElementById('playerTag').value;

            const wins = data.wins, total = data.wins + data.losses, pb = data.bestTrophies;
            const wr = wins / total, tcr = data.threeCrownWins / wins, ntcr = (wins - data.threeCrownWins) / wins;

            let str = Math.min(100, (tcr * 150) + (wr * 40));
            let def = Math.min(100, (ntcr * 120) + (wr * 30));
            let mac = Math.min(100, (pb / 9000 * 80) + (wr * 40));
            let psy = Math.min(100, (pb > 7500 ? (pb-7500)/15 : pb/100) + (wr*50));
            let cst = Math.min(100, (Math.log10(total) / Math.log10(60000)) * 100);
            let mic = Math.min(100, (pb / 9000 * 40) + (ntcr * wr * 150));

            const pillars = [str, def, mic, mac, psy, cst];
            const pIds = ['val-str', 'val-def', 'val-mic', 'val-mac', 'val-psy', 'val-cst'];

            pIds.forEach((id, i) => {
                document.getElementById(id).innerText = Math.round(pillars[i]);
                document.getElementById(`node-${i+1}`).classList.add('visible');
            });

            radarChart.data.datasets[0].data = pillars;
            radarChart.update();

            // 幾何面積算法 (M.V.I)
            const sin60 = 0.866;
            const area = 0.5 * sin60 * (str*def + def*mic + mic*mac + mac*psy + psy*cst + cst*str);
            const mvi = (area / 25980) * 100;

            document.getElementById('ui-ncr').innerText = mvi.toFixed(2);
            
            // 修正點：加上引號
            let rankClass = "戰力成型", color = "var(--pure-white)";
            if (mvi >= 85) { rankClass = "極限超載"; color = "var(--holo-cyan)"; }
            else if (mvi >= 65) { rankClass = "特化專家"; color = "var(--apex-gold)"; }

            const classEl = document.getElementById('ui-class');
            classEl.innerText = `價值綻放度：${rankClass}`;
            classEl.style.color = color;

            document.getElementById('analysis-report').innerHTML = `<span class="hl-gold">微操解析：</span> 該玩家的 MIC 指數為 ${Math.round(mic)}。這代表在殘局高壓環境下，目標具備極強的下兵位置感與法術精準度。`;
            await tLog(`> Analysis complete.`, 'sys-log');
        }

        window.onload = initCharts;
    </script>
</body>
</html>
