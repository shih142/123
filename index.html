<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMA 12D - VANGUARD TACTICAL HUD</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700;900&display=swap');

        :root {
            --cyan: #00e5ff;
            --blue: #2962ff;
            --gold: #ffab00;
            --red: #ff1744;
            --green: #00e676;
            --bg-dark: #0a0b10;
            --panel-bg: rgba(16, 20, 30, 0.85);
            --border-glow: rgba(0, 229, 255, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px;
        }

        header { text-align: center; margin-bottom: 30px; text-transform: uppercase; }
        h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 3rem; color: #fff; letter-spacing: 5px; text-shadow: 0 0 15px var(--cyan); margin-bottom: 5px; }
        .sys-status { font-size: 1.1rem; color: var(--cyan); letter-spacing: 4px; font-weight: 700; }

        .control-hub {
            background: var(--panel-bg); border: 1px solid var(--cyan); padding: 20px; border-radius: 8px;
            display: flex; gap: 15px; width: 100%; max-width: 650px; margin-bottom: 30px;
            box-shadow: 0 0 20px var(--border-glow), inset 0 0 10px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }

        input {
            flex: 1; background: rgba(0, 20, 40, 0.6); border: 1px solid var(--blue); color: #fff;
            padding: 15px; border-radius: 4px; font-family: 'Orbitron', sans-serif; font-size: 1.1rem; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }

        button {
            background: linear-gradient(45deg, var(--blue), var(--cyan)); color: #fff; border: none; padding: 0 35px; border-radius: 4px;
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.1rem; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        button:hover { filter: brightness(1.2); box-shadow: 0 0 20px var(--cyan); }

        #alert-box { display: none; width: 100%; max-width: 650px; padding: 15px; background: rgba(255, 23, 68, 0.15); border-left: 5px solid var(--red); color: #ff8a8a; margin-bottom: 20px; font-weight: bold; border-radius: 4px; text-align: center; }

        .dashboard { display: none; width: 100%; max-width: 1150px; gap: 25px; align-items: stretch; animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .panel {
            background: var(--panel-bg); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 12px;
            padding: 30px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .side-panel { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .radar-panel { flex: 1.5; display: flex; justify-content: center; align-items: center; position: relative; min-height: 480px; }

        .rating-box {
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(10,20,40,0.9)); border: 2px solid var(--cyan); border-radius: 8px; padding: 20px; text-align: center;
            box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.1); transition: all 0.4s ease;
        }
        .rating-label { font-size: 1rem; color: var(--cyan); font-weight: bold; letter-spacing: 3px; }
        .rating-rank { font-family: 'Orbitron', sans-serif; font-size: 4rem; font-weight: 900; line-height: 1.1; margin: 5px 0; text-shadow: 0 0 15px currentColor; transition: color 0.5s ease; }
        .rating-score { font-size: 1.1rem; color: #aaa; font-family: 'Orbitron', sans-serif; }
        .score-num { font-weight: bold; color: #fff; font-size: 1.3rem; }

        .player-header { border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 5px; }
        .player-name { font-size: 2rem; font-family: 'Orbitron', sans-serif; font-weight: bold; color: #fff; text-transform: uppercase; }
        .player-tag { color: #888; font-size: 1rem; letter-spacing: 2px; }

        .radical-bars { display: flex; flex-direction: column; gap: 15px; margin-top: 5px; }
        .bar-container { display: flex; flex-direction: column; gap: 6px; }
        .bar-header { display: flex; justify-content: space-between; align-items: flex-end; }
        .bar-label { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; color: #ccc; }
        .atk-label { color: var(--red); } .def-label { color: var(--cyan); }
        .bar-val { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 900; }
        .bar-bg { width: 100%; height: 10px; background: rgba(0,0,0,0.8); border: 1px solid #333; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .atk-fill { background: linear-gradient(90deg, #800, var(--red)); box-shadow: 0 0 10px var(--red); }
        .def-fill { background: linear-gradient(90deg, #004, var(--cyan)); box-shadow: 0 0 10px var(--cyan); }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .stat-group { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 6px; border-left: 3px solid #555; transition: 0.3s; }
        .stat-group:hover { background: rgba(255,255,255,0.08); border-left-color: var(--cyan); }
        .stat-label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; margin-bottom: 2px; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #fff; display: flex; align-items: baseline; gap: 4px; }
        .stat-unit { font-size: 0.8rem; color: var(--cyan); }

        @media (max-width: 900px) { .dashboard { flex-direction: column; } .radar-panel { min-height: 380px; } }
    </style>
</head>
<body>

    <header>
        <h1>VANGUARD HUD</h1>
        <div class="sys-status" id="sys-status">/// DYNAMIC EQUILIBRIUM PROTOCOL ///</div>
    </header>

    <div class="control-hub">
        <input type="text" id="playerTag" placeholder="ENTER PLAYER TAG (e.g. P8RR2P)" autocomplete="off">
        <button onclick="runScan()" id="scanBtn">ANALYZE</button>
    </div>

    <div id="alert-box"></div>

    <div class="dashboard" id="dashboard">
        <div class="panel side-panel">
            
            <div class="rating-box" id="rating-container">
                <div class="rating-label">TACTICAL TIER</div>
                <div class="rating-rank" id="ui-rank">--</div>
                <div class="rating-score">COMPOSITE INDEX: <span class="score-num" id="ui-score">0000</span></div>
            </div>

            <div class="player-header">
                <div class="player-tag" id="ui-tag">#TAG</div>
                <div class="player-name" id="ui-name">PLAYER NAME</div>
            </div>

            <div class="radical-bars">
                <div class="bar-container">
                    <div class="bar-header">
                        <div class="bar-label atk-label">KINETIC YIELD (ATK)</div>
                        <div class="bar-val" style="color: var(--red);" id="txt-atk">0</div>
                    </div>
                    <div class="bar-bg"><div class="bar-fill atk-fill" id="bar-atk"></div></div>
                </div>
                <div class="bar-container">
                    <div class="bar-header">
                        <div class="bar-label def-label">ARMOR INTEGRITY (DEF)</div>
                        <div class="bar-val" style="color: var(--cyan);" id="txt-def">0</div>
                    </div>
                    <div class="bar-bg"><div class="bar-fill def-fill" id="bar-def"></div></div>
                </div>
            </div>

            <div class="stat-grid">
                <div class="stat-group">
                    <div class="stat-label">WIN RATE (OBSERVED)</div>
                    <div class="stat-value"><span id="ui-win">0</span><span class="stat-unit">%</span></div>
                </div>
                <div class="stat-group">
                    <div class="stat-label">AVG ELIXIR</div>
                    <div class="stat-value"><span id="ui-elixir">0.0</span><span class="stat-unit">λ</span></div>
                </div>
            </div>
        </div>

        <div class="panel radar-panel">
            <canvas id="radarChart"></canvas>
        </div>
    </div>

    <script>
        let myChart = null;

        function showAlert(msg) {
            const box = document.getElementById('alert-box'); box.style.display = 'block'; box.innerText = `[SYSTEM ALERT] ${msg}`;
        }
        function hideAlert() { document.getElementById('alert-box').style.display = 'none'; }

        function clamp(val) { return Math.max(0, Math.min(100, val)); }
        function getStdDev(arr, mean) { return arr.length ? Math.sqrt(arr.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / arr.length) : 0; }
        function boxMuller() {
            let u = 0, v = 0;
            while(u === 0) u = Math.random(); while(v === 0) v = Math.random();
            return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        }

        async function runScan() {
            const tagInput = document.getElementById('playerTag').value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            if (!tagInput) return showAlert("INVALID IDENTIFIER.");

            const btn = document.getElementById('scanBtn');
            hideAlert(); document.getElementById('dashboard').style.display = "none";
            btn.innerText = "PROCESSING..."; btn.style.pointerEvents = "none";

            document.getElementById('bar-atk').style.width = '0%'; document.getElementById('bar-def').style.width = '0%';

            try {
                const targetUrl = new URL('/api/clash-proxy', window.location.origin);
                targetUrl.searchParams.append('tag', tagInput);
                const response = await fetch(targetUrl.toString(), { method: 'GET', headers: { 'Accept': 'application/json' } });
                const data = await response.json();
                if (!response.ok) throw new Error(data.details || data.error || "Connection Interrupted.");
                updateUI(data);
            } catch (error) {
                showAlert(error.message);
            } finally {
                btn.innerText = "ANALYZE"; btn.style.pointerEvents = "auto";
            }
        }

        function updateUI(data) {
            document.getElementById('dashboard').style.display = "flex";
            
            document.getElementById('ui-tag').innerText = `#${data.tag}`;
            document.getElementById('ui-name').innerText = data.name;
            document.getElementById('ui-win').innerText = (data.winRate || 0).toFixed(1);
            document.getElementById('ui-elixir').innerText = data.avgDeckElixir || '0.0';

            const avgElixir = parseFloat(data.avgDeckElixir) || 3.2; 
            const avgTowerHP = Math.max(1, parseFloat(data.avgTowerHP) || 3000); 
            const hpStdDev = getStdDev(data.hpHistory || [], avgTowerHP);
            const lowHpClutchR = data.lowHpClutchRate || 0; 
            const clutchR = data.clutchRate || 0; 
            const C_earned = parseFloat(data.avgCrownsEarned) || 0;
            const C_lost = parseFloat(data.avgCrownsLost) || 0;
            const r_3C = data.threeCrownRate || 0;
            const N = Math.max(1, data.battleCount || 1);
            const hpRatio = clamp(avgTowerHP / 8500.0 * 100) / 100; // 0~1

            // ==========================================
            // VANGUARD: 動態平衡演算法 (Dynamic Equilibrium)
            // ==========================================

            // 1. ATK (Kinetic Yield): 50% 線性基礎 + 50% 二次方爆發。兼顧常態分佈與頂尖獎勵。
            const ATK = clamp(100 * (0.5 * (C_earned / 3.0) + 0.5 * Math.pow(C_earned / 2.5, 2)) + (r_3C * 50));

            // 2. DEF (Armor Integrity): 混合物理韌性 (根號) 與絕對血量 (線性)，加上中度指數衰退。
            const DEF = clamp(100 * (0.6 * Math.sqrt(hpRatio) + 0.4 * hpRatio) * Math.exp(-0.5 * C_lost));

            // 3. SKL (Execution Skill): Tanh 函數映射，在表現達到某個閾值前平滑上升，隨後趨近飽和。
            const SKL = clamp(100 * Math.tanh(clutchR * 2.0 + lowHpClutchR * 3.0));

            // 4. CRT (Critical Mass): 三冠率與低費率的線性聯動。
            const CRT = clamp(r_3C * 100 * (3.5 / avgElixir));

            // 5. END (Tenacity): 大數法則的溫和對數曲線。
            const END = clamp(100 * (Math.log10(N + 1) / 3.5)); 

            // 6. CLT (Clutch Survival): 殘血反殺率的平滑漸近線。
            const CLT = clamp(100 * Math.tanh(lowHpClutchR * 4.5));

            // 7. SPD (Cycle Kinematics): 針對均費的溫和指數獎勵 (1.5次方)。
            const SPD = clamp(Math.pow((3.0 / avgElixir), 1.5) * 45); 
            
            // 8. ACC (Net Domination): 淨勝冠數的映射，保留零和博弈精神，但不會太過苛刻。
            const netCrowns = C_earned - C_lost;
            const ACC = clamp(50 + (netCrowns * 25)); 

            // 9. STA (Variance Stability): 變異係數的懲罰機制，乘上 1.5 倍強化波動的負面影響。
            const STA = clamp(100 * (1 - (hpStdDev / avgTowerHP) * 1.5));
            
            // 10. AGI (RMS Vector): 保留數學界最完美的均方根向量長度。
            const AGI = clamp(Math.sqrt((Math.pow(SPD, 2) + Math.pow(CLT, 2) + Math.pow(ATK, 2)) / 3));
            
            // 11. INT (Tactical Density): 聖水轉換效率。
            const INT = clamp(100 * (C_earned / (avgElixir * 0.8)));
            
            // 12. LUK (Stochastic Variance): 收斂的高斯分佈，標準差設為 8。
            const LUK = clamp(50 + (boxMuller() * 8));

            setTimeout(() => {
                document.getElementById('bar-atk').style.width = `${ATK}%`;
                document.getElementById('bar-def').style.width = `${DEF}%`;
                animateValue("txt-atk", 0, Math.round(ATK), 1200);
                animateValue("txt-def", 0, Math.round(DEF), 1200);
            }, 100);

            const metrics = [DEF, ATK, SKL, CRT, END, CLT, SPD, ACC, LUK, STA, AGI, INT];

            // 總分採用歐幾里得 L2 範數
            const tensorMagnitude = Math.sqrt(metrics.reduce((acc, val) => acc + Math.pow(val, 2), 0));
            const rawScore = Math.round((tensorMagnitude / 346.41) * 10000); 
            
            // 級別判定 (平衡型標準)
            let rank = 'C'; let rankColor = '#aaa';
            if (rawScore >= 8800) { rank = 'X (OMEGA)'; rankColor = '#ffab00'; } 
            else if (rawScore >= 7800) { rank = 'SS (ELITE)'; rankColor = '#ff1744'; } 
            else if (rawScore >= 6500) { rank = 'S (VANGUARD)'; rankColor = '#bc13fe'; }  
            else if (rawScore >= 5000) { rank = 'A (EXPERT)'; rankColor = '#00e5ff'; }  
            else if (rawScore >= 3500) { rank = 'B (STANDARD)'; rankColor = '#00e676'; }  

            const uiRank = document.getElementById('ui-rank');
            const ratingContainer = document.getElementById('rating-container');
            
            uiRank.innerText = rank;
            uiRank.style.color = rankColor;
            ratingContainer.style.borderColor = rankColor;
            
            animateValue("ui-score", 0, rawScore, 1000);
            drawChart(metrics, rankColor);
        }

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id); let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step); 
            };
            window.requestAnimationFrame(step);
        }

        function drawChart(dataValues, mainColor) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            if (myChart) myChart.destroy(); 
            Chart.defaults.color = '#888'; Chart.defaults.font.family = 'Orbitron';
            myChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['DEF (Armor)', 'ATK (Yield)', 'SKL (Execution)', 'CRT (Critical)', 'END (Tenacity)', 'CLT (Clutch)', 'SPD (Cycle)', 'ACC (Dominate)', 'LUK (Variance)', 'STA (Stability)', 'AGI (Momentum)', 'INT (Density)'],
                    datasets: [{
                        label: 'VANGUARD SPECS', data: dataValues,
                        backgroundColor: `${mainColor}25`, borderColor: mainColor, borderWidth: 2,
                        pointBackgroundColor: '#fff', pointBorderColor: mainColor, pointRadius: 3, pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        r: { 
                            angleLines: { color: 'rgba(255,255,255,0.05)', lineWidth: 1 }, 
                            grid: { color: 'rgba(255,255,255,0.1)' }, 
                            pointLabels: { color: '#bbb', font: { size: 10, weight: 'bold' } }, 
                            ticks: { display: false, min: 0, max: 100 } 
                        }
                    },
                    plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(0,0,0,0.85)', titleColor: mainColor, bodyFont: {family: 'Rajdhani', size: 14}, borderColor: mainColor, borderWidth: 1 } }
                }
            });
        }
    </script>
</body>
</html>
