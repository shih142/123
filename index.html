<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMA 12D - LIFETIME CAREER HUD</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700;900&display=swap');

        :root {
            --cyan: #00f2ff;
            --purple: #bc13fe;
            --red: #ff2a2a;
            --gold: #ffb700;
            --bg-dark: #05070f;
            --panel-bg: rgba(12, 15, 26, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px;
        }

        header { text-align: center; margin-bottom: 30px; text-transform: uppercase; }
        h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 3rem; color: var(--cyan); letter-spacing: 6px; text-shadow: 0 0 20px rgba(0,242,255,0.4); margin-bottom: 5px; }
        .sys-status { font-size: 1rem; color: var(--gold); letter-spacing: 3px; font-weight: bold; }

        .control-hub {
            background: var(--panel-bg); border: 1px solid rgba(0, 242, 255, 0.3); padding: 20px; border-radius: 12px;
            display: flex; gap: 15px; width: 100%; max-width: 600px; margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,242,255,0.05);
            backdrop-filter: blur(10px);
        }

        input {
            flex: 1; background: rgba(0,0,0,0.6); border: 1px solid var(--cyan); color: var(--cyan);
            padding: 15px; border-radius: 6px; font-family: 'Orbitron', sans-serif; font-size: 1.1rem; outline: none; transition: 0.3s;
        }
        input:focus { box-shadow: 0 0 15px rgba(0, 242, 255, 0.4); }
        input::placeholder { color: rgba(0, 242, 255, 0.3); }

        button {
            background: var(--cyan); color: #000; border: none; padding: 0 30px; border-radius: 6px;
            font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        button:hover { background: #fff; box-shadow: 0 0 20px var(--cyan); transform: scale(1.02); }

        #alert-box { display: none; width: 100%; max-width: 600px; padding: 15px; background: rgba(255, 42, 42, 0.1); border-left: 5px solid var(--red); color: var(--red); margin-bottom: 20px; font-weight: bold; border-radius: 4px; text-align: center; }

        .dashboard {
            display: none; width: 100%; max-width: 1100px; gap: 25px; align-items: stretch; animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .panel {
            background: var(--panel-bg); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 15px;
            padding: 30px; backdrop-filter: blur(10px); box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .side-panel { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .radar-panel { flex: 1.5; display: flex; justify-content: center; align-items: center; position: relative; min-height: 450px; }

        .rating-box {
            background: rgba(0, 0, 0, 0.6); border: 2px solid var(--gold); border-radius: 10px; padding: 20px; text-align: center;
            box-shadow: 0 0 20px rgba(255, 183, 0, 0.2), inset 0 0 15px rgba(255, 183, 0, 0.1);
            position: relative; overflow: hidden; transition: border-color 0.5s ease;
        }
        .rating-box::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, transparent, transparent, currentColor);
            animation: rotate 4s linear infinite; opacity: 0.1; z-index: 0;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        .rating-label { font-size: 1rem; color: #aaa; font-weight: bold; letter-spacing: 2px; position: relative; z-index: 1; }
        .rating-rank { 
            font-family: 'Orbitron', sans-serif; font-size: 4rem; font-weight: 900; line-height: 1.1; margin: 5px 0;
            text-shadow: 0 0 20px currentColor; position: relative; z-index: 1; transition: color 0.5s ease;
        }
        .rating-score { font-size: 1.2rem; color: #fff; font-family: 'Orbitron', sans-serif; position: relative; z-index: 1; }
        .score-num { color: var(--cyan); font-weight: bold; }

        .player-header { border-bottom: 2px solid var(--purple); padding-bottom: 10px; margin-bottom: 5px; }
        .player-name { font-size: 2rem; font-family: 'Orbitron', sans-serif; font-weight: bold; color: #fff; text-transform: uppercase; word-break: break-all; }
        .player-tag { color: var(--cyan); font-size: 1.1rem; letter-spacing: 2px; }

        .stat-group { background: rgba(255,255,255,0.02); padding: 12px; border-radius: 8px; border-left: 3px solid var(--cyan); }
        .stat-label { font-size: 0.85rem; color: #888; text-transform: uppercase; margin-bottom: 3px; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: #fff; display: flex; align-items: baseline; gap: 5px; }
        .stat-unit { font-size: 0.9rem; color: var(--cyan); }

        @media (max-width: 900px) {
            .dashboard { flex-direction: column; }
            .radar-panel { min-height: 350px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>MAXIMA 12D</h1>
        <div class="sys-status" id="sys-status">/// LIFETIME CAREER ANALYTICS ENGINE ///</div>
    </header>

    <div class="control-hub">
        <input type="text" id="playerTag" placeholder="ENTER PLAYER TAG (e.g. P8RR2P)" autocomplete="off">
        <button onclick="runScan()" id="scanBtn">INITIATE</button>
    </div>

    <div id="alert-box"></div>

    <div class="dashboard" id="dashboard">
        <div class="panel side-panel">
            
            <div class="rating-box" id="rating-container">
                <div class="rating-label">CAREER POWER LEVEL</div>
                <div class="rating-rank" id="ui-rank">--</div>
                <div class="rating-score">SCORE: <span class="score-num" id="ui-score">0000</span></div>
            </div>

            <div class="player-header">
                <div class="player-tag" id="ui-tag">#TAG</div>
                <div class="player-name" id="ui-name">PLAYER NAME</div>
            </div>

            <div class="stat-group">
                <div class="stat-label">CAREER WIN RATE (LIFETIME)</div>
                <div class="stat-value"><span id="ui-win">0</span> <span class="stat-unit">%</span></div>
            </div>
            
            <div class="stat-group">
                <div class="stat-label">PEAK TROPHIES (ACHIEVEMENT)</div>
                <div class="stat-value"><span id="ui-trophies">0</span> <span class="stat-unit">TR</span></div>
            </div>

            <div class="stat-group" style="border-left-color: #555;">
                <div class="stat-label">LIFETIME BATTLES</div>
                <div class="stat-value"><span id="ui-battles">0</span> <span class="stat-unit">MATCHES</span></div>
            </div>
        </div>

        <div class="panel radar-panel">
            <canvas id="radarChart"></canvas>
        </div>
    </div>

    <script>
        let myChart = null;

        function showAlert(msg) {
            const box = document.getElementById('alert-box');
            box.style.display = 'block';
            box.innerText = `[SYSTEM ERROR] ${msg}`;
        }
        function hideAlert() { document.getElementById('alert-box').style.display = 'none'; }

        // Tag Hash (固定量子擾動)
        function getTagHash(tag) {
            let hash = 0;
            for (let i = 0; i < tag.length; i++) hash = tag.charCodeAt(i) + ((hash << 5) - hash);
            return Math.abs(hash);
        }

        // ==========================================
        // 專業數學函數庫 (Advanced Math Library)
        // ==========================================
        
        function clamp(val) { return Math.max(15, Math.min(99, val)); }

        // 邏輯斯諦 S型曲線 (Sigmoid Curve)
        function sigmoid(val, x0, k) {
            return 100 / (1 + Math.exp(-k * (val - x0)));
        }

        // 對數增幅 (Logarithmic Scaling) - 用於平滑處理上萬場次的生涯數據
        function logScale(val, modifier) {
            return Math.log(Math.max(1, val)) * modifier;
        }

        async function runScan() {
            const tagInput = document.getElementById('playerTag').value;
            const btn = document.getElementById('scanBtn');
            const dashboard = document.getElementById('dashboard');
            
            const cleanTag = tagInput.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            if (!cleanTag) return showAlert("INVALID TAG FORMAT.");

            hideAlert();
            dashboard.style.display = "none";
            btn.innerText = "EXTRACTING LIFETIME DATA...";
            btn.style.pointerEvents = "none";

            try {
                const targetUrl = new URL('/api/clash-proxy', window.location.origin);
                targetUrl.searchParams.append('tag', cleanTag);

                const response = await fetch(targetUrl.toString(), { method: 'GET', headers: { 'Accept': 'application/json' } });
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.details || data.error || "Connection Failed.");

                updateUI(data);
                
            } catch (error) {
                console.error("Scan Failed:", error);
                showAlert(error.message);
            } finally {
                btn.innerText = "INITIATE";
                btn.style.pointerEvents = "auto";
            }
        }

        // ==========================================
        // 生涯抽象維度運算核心 (Lifetime Dimension Algorithms)
        // ==========================================
        function updateUI(data) {
            document.getElementById('dashboard').style.display = "flex";
            
            // 解析生涯原始數據 (Fallback 容錯機制)
            const wins = data.wins || 0;
            const losses = data.losses || 0;
            const battles = data.battleCount || (wins + losses) || 1; 
            const threeCrownWins = data.threeCrownWins || 0;
            const trophies = data.trophies || 0;
            const bestTrophies = data.bestTrophies || 0;
            const tourneyBattles = data.tournamentBattleCount || 0;
            const warWins = data.warDayWins || 0;
            const donations = data.totalDonations || 0;

            const careerWinRate = (wins / battles) * 100;
            const threeCrownRate = threeCrownWins / Math.max(1, wins);

            // 更新左側 UI 面板
            document.getElementById('ui-tag').innerText = `#${data.tag}`;
            document.getElementById('ui-name').innerText = data.name;
            document.getElementById('ui-win').innerText = careerWinRate.toFixed(1);
            document.getElementById('ui-battles').innerText = battles;
            document.getElementById('ui-trophies').innerText = bestTrophies;

            // ==========================================
            // 生涯 12D 抽象映射 (Lifetime Metric Mapping)
            // ==========================================
            
            // 1. SKL (技巧 - Mastery)：最高盃數的 S型映射。
            // 拐點設在 6500 盃，突破 8500 盃曲線將趨近滿分。
            const SKL = clamp(sigmoid(bestTrophies, 6500, 0.0015));

            // 2. ACC (精準 - Accuracy)：生涯總勝率收斂。
            // 拐點設在 52% (一般玩家極限)，極少數能在龐大基數維持 60%+ 的玩家將獲得高分。
            const ACC = clamp(sigmoid(careerWinRate / 100, 0.52, 25));

            // 3. CRT (爆發 - Dominance)：生涯三冠勝率。
            // 三冠勝場佔總勝場的比例，拐點設在 30%。
            const CRT = clamp(sigmoid(threeCrownRate, 0.3, 10));

            // 4. END (耐力 - Stamina)：總對戰場次的對數增幅。
            // 場次越多，加分邊際效應越小。10,000 場約可獲得 80+ 分。
            const END = clamp(15 + logScale(battles, 8.5));

            // 5. ATK (攻擊 - Lethality)：生涯純勝場數。
            const ATK = clamp(15 + logScale(wins, 9.5));

            // 6. DEF (防禦 - Resilience)：敗北迴避率。
            // 計算 1 - (敗場/總場)，並透過 S曲線放大防守底蘊。
            const avoidLossRate = 1 - (losses / battles);
            const DEF = clamp(sigmoid(avoidLossRate, 0.48, 30));

            // 7. CLT (抗壓 - Clutch)：當前盃數維持率。
            // 當前盃數越接近最高盃數，代表在高壓環境下依然能保持水準不掉分。
            const trophyRetention = trophies / Math.max(1, bestTrophies);
            const CLT = clamp(sigmoid(trophyRetention, 0.9, 15));

            // 8. AGI (靈活 - Adaptability)：部落戰勝場。
            // 部落戰需要使用 4 套完全不同的牌組，勝場數極大程度反映了牌池深度與靈活度。
            const AGI = clamp(15 + logScale(warWins, 12));

            // 9. STA (穩定 - Consistency)：錦標賽/挑戰賽場次。
            // 錦標賽採用標準化等級(11等)，不受卡等壓制影響，大量參與代表具備高度穩定的競技底板。
            const STA = clamp(20 + logScale(tourneyBattles, 10));

            // 10. INT (戰術 - Trophy Efficiency)：衝盃效率。
            // (最高盃數 / 總場次) 比例。用極少場次衝上高盃的玩家(分身/天才)，戰術效益極高。
            const efficiency = bestTrophies / Math.max(1, battles);
            const INT = clamp(sigmoid(efficiency, 1.2, 3));

            // 11. SPD (節奏 - Progression Speed)：上分動能與活躍度。
            // 綜合勝率與近期捐贈活躍度。
            const SPD = clamp((ACC * 0.6) + (sigmoid(donations, 10000, 0.0002) * 40));

            // 12. LUK (運氣 - Karma / Quantum)：
            // 基於總捐贈數(Karma人品積累) 加上 Tag 的量子波動。
            const quantumState = (getTagHash(data.tag) % 15) - 7.5;
            const karma = sigmoid(donations, 50000, 0.0001) * 30; 
            const LUK = clamp(50 + karma + quantumState);

            const metrics = [DEF, ATK, SKL, CRT, END, CLT, SPD, ACC, LUK, STA, AGI, INT];

            // ==========================================
            // 生涯戰力階級系統 (Career Power Matrix)
            // ==========================================
            
            // 幾何平均與算術平均的融合
            const sumLog = metrics.reduce((acc, val) => acc + Math.log(val), 0);
            const geometricMean = Math.exp(sumLog / 12);
            const arithmeticMean = metrics.reduce((a, b) => a + b, 0) / 12;
            
            // 轉化為萬分制生涯戰力指數
            const rawScore = Math.round(((geometricMean * 0.6) + (arithmeticMean * 0.4)) / 100 * 9500 + (careerWinRate * 5)); 
            
            let rank = 'D'; let rankColor = '#aaa';
            if (rawScore >= 8500) { rank = 'SSS'; rankColor = '#ffb700'; } // God Tier
            else if (rawScore >= 7500) { rank = 'SS'; rankColor = '#ff2a2a'; } // Legend
            else if (rawScore >= 6500) { rank = 'S'; rankColor = '#bc13fe'; }  // Master
            else if (rawScore >= 5500) { rank = 'A'; rankColor = '#00f2ff'; }  // Elite
            else if (rawScore >= 4500) { rank = 'B'; rankColor = '#00ff44'; }  // Veteran
            else if (rawScore >= 3500) { rank = 'C'; rankColor = '#fff'; }     // Challenger

            const uiRank = document.getElementById('ui-rank');
            const ratingContainer = document.getElementById('rating-container');
            
            uiRank.innerText = rank;
            uiRank.style.color = rankColor;
            ratingContainer.style.borderColor = rankColor;
            
            animateValue("ui-score", 0, rawScore, 1000);
            drawChart(metrics, rankColor);
        }

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step); 
            };
            window.requestAnimationFrame(step);
        }

        function drawChart(dataValues, mainColor) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            if (myChart) myChart.destroy(); 
            
            Chart.defaults.color = '#888';
            Chart.defaults.font.family = 'Orbitron';

            myChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['DEF (防禦)', 'ATK (攻擊)', 'SKL (技巧)', 'CRT (爆發)', 'END (耐力)', 'CLT (抗壓)', 'SPD (節奏)', 'ACC (精準)', 'LUK (運氣)', 'STA (穩定)', 'AGI (靈活)', 'INT (戰術)'],
                    datasets: [{
                        label: 'LIFETIME TENSORS',
                        data: dataValues,
                        backgroundColor: `${mainColor}25`,
                        borderColor: mainColor,
                        borderWidth: 2,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: mainColor,
                        pointHoverBackgroundColor: mainColor,
                        pointHoverBorderColor: '#fff',
                        pointRadius: 3,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)', lineWidth: 1 },
                            grid: { color: 'rgba(255, 255, 255, 0.1)', circular: true },
                            pointLabels: { color: mainColor, font: { size: 11, weight: 'bold' } },
                            ticks: { display: false, min: 0, max: 100 }
                        }
                    },
                    plugins: { 
                        legend: { display: false }, 
                        tooltip: { 
                            backgroundColor: 'rgba(0,0,0,0.9)', 
                            titleColor: mainColor, 
                            bodyFont: {size: 14, family: 'Rajdhani'},
                            borderColor: mainColor,
                            borderWidth: 1
                        } 
                    }
                }
            });
        }
    </script>
</body>
</html>
