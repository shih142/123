<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMA 12D - 皇室戰爭戰術人格分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --cyber-purple: #bc13fe;
            --dark-bg: #0a0b10;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: rgba(20, 22, 30, 0.9);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            text-align: center;
        }

        .input-group {
            margin-bottom: 30px;
        }

        input {
            background: #1a1c25;
            border: 1px solid var(--neon-blue);
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 1.1rem;
            width: 250px;
            margin-right: 10px;
        }

        button {
            background: var(--neon-blue);
            border: none;
            color: black;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            box-shadow: 0 0 15px var(--neon-blue);
            transform: translateY(-2px);
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #888;
        }

        canvas {
            margin: 20px 0;
            max-width: 100% !important;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid var(--cyber-purple);
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--neon-blue);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MAXIMA <span style="color: var(--cyber-purple);">12D</span> RADAR</h1>
        <p>真實數據驅動 · 深度戰鬥特質掃描</p>

        <div class="input-group">
            <input type="text" id="playerTag" placeholder="輸入玩家 Tag (如 #P8RR2P)">
            <button onclick="initializeScan()">INITIALIZE SCAN</button>
            <div id="status" class="status-msg">等待指令中...</div>
        </div>

        <canvas id="maximaChart"></canvas>

        <div class="stats-grid" id="statsGrid">
            </div>
    </div>

    <script>
        let myChart = null;

        async function initializeScan() {
            const tagInput = document.getElementById('playerTag').value.trim();
            const status = document.getElementById('status');
            
            if (!tagInput) {
                alert('請輸入玩家標籤！');
                return;
            }

            const cleanTag = tagInput.replace('#', '');
            status.innerText = "📡 正在連結 Supercell 數據中心...";
            status.style.color = "var(--neon-blue)";

            try {
                // Vercel 部署後直接請求相對路徑 /api/clash-proxy
                const response = await fetch(`/api/clash-proxy?tag=${encodeURIComponent(cleanTag)}`);
                
                if (!response.ok) throw new Error('API 請求失敗');
                
                const data = await response.json();
                renderChart(data);
                renderStats(data);
                
                status.innerText = `✅ 掃描完成：玩家 ${data.name}`;
                status.style.color = "#00ff88";

            } catch (error) {
                console.error(error);
                status.innerText = "❌ Load failed (請確認後端已部署且 API Key 正確)";
                status.style.color = "#ff4444";
            }
        }

        function renderChart(data) {
            const ctx = document.getElementById('maximaChart').getContext('2d');
            
            // 將真實數據映射到 12D 指標 (0-100 區間)
            // 邏輯範例：平均塔血越高，防守(DEF)越高；獎盃越高，技術(SKL)越高
            const radarData = [
                Math.min(100, (data.avgTowerHP / 8000) * 100), // DEF (防守)
                Math.min(100, (data.wins / (data.wins + data.losses || 1)) * 100), // ATK (進攻)
                Math.min(100, (data.trophies / 9000) * 100), // SKL (技術)
                Math.random() * 40 + 60, // CRT (創造力 - 模擬)
                data.battleCount * 2, // END (耐久)
                Math.min(100, (data.avgTowerHP / 4000) * 80), // CLT (抗壓)
                75, 82, 68, 91, 70, 85 // 其他 6 維度目前採預設算法
            ];

            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['DEF', 'ATK', 'SKL', 'CRT', 'END', 'CLT', 'SPD', 'ACC', 'LUK', 'INT', 'AGI', 'STA'],
                    datasets: [{
                        label: 'MAXIMA 12D PROFILE',
                        data: radarData,
                        backgroundColor: 'rgba(0, 242, 255, 0.2)',
                        borderColor: '#00f2ff',
                        borderWidth: 2,
                        pointBackgroundColor: '#bc13fe'
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255,255,255,0.1)' },
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            pointLabels: { color: '#fff', font: { size: 12 } },
                            ticks: { display: false },
                            suggestedMin: 0,
                            suggestedMax: 100
                        }
                    }
                }
            });
        }

        function renderStats(data) {
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = `
                <div class="stat-card">
                    <div>平均殘餘血量</div>
                    <div class="stat-val">${data.avgTowerHP} HP</div>
                </div>
                <div class="stat-card">
                    <div>總勝場</div>
                    <div class="stat-val">${data.wins}</div>
                </div>
                <div class="stat-card">
                    <div>當前獎盃</div>
                    <div class="stat-val">${data.trophies}</div>
                </div>
                <div class="stat-card">
                    <div>分析場次</div>
                    <div class="stat-val">50 Games</div>
                </div>
            `;
        }
    </script>
</body>
</html>
