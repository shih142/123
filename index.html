<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMA 12D - 戰術人格掃描儀</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --cyber-purple: #bc13fe;
            --dark-bg: #0d0e14;
        }
        body {
            background-color: var(--dark-bg);
            color: #e0e0e0;
            font-family: 'Orbitron', sans-serif, "Microsoft JhengHei";
            display: flex; flex-direction: column; align-items: center; padding: 40px 20px;
        }
        .panel {
            background: linear-gradient(145deg, #161822, #0d0e14);
            border: 1px solid var(--neon-blue);
            border-radius: 20px; padding: 30px; width: 100%; max-width: 700px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.15); text-align: center;
        }
        h1 { font-size: 2rem; letter-spacing: 5px; color: var(--neon-blue); margin-bottom: 5px; }
        .subtitle { font-size: 0.8rem; color: var(--cyber-purple); margin-bottom: 30px; text-transform: uppercase; }
        
        .search-box { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; }
        input {
            background: #1a1c2a; border: 1px solid #333; color: white;
            padding: 12px 20px; border-radius: 8px; outline: none; width: 200px;
        }
        input:focus { border-color: var(--neon-blue); }
        button {
            background: var(--neon-blue); color: black; border: none;
            padding: 12px 25px; border-radius: 8px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
        }
        button:hover { box-shadow: 0 0 20px var(--neon-blue); transform: translateY(-2px); }

        #status { font-size: 0.9rem; margin-bottom: 20px; color: #888; min-height: 1.2em; }
        canvas { margin: 20px 0; }
        
        .result-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px;
        }
        .card {
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px;
            border-bottom: 2px solid var(--cyber-purple);
        }
        .card-label { font-size: 0.75rem; color: #aaa; margin-bottom: 5px; }
        .card-value { font-size: 1.5rem; font-weight: bold; color: white; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="panel">
        <h1>MAXIMA 12D</h1>
        <div class="subtitle">Tactical Intelligence Interface</div>

        <div class="search-box">
            <input type="text" id="playerTag" placeholder="PLAYER TAG (e.g. #P8RR2P)">
            <button onclick="startAnalysis()">START SCAN</button>
        </div>

        <div id="status">等待輸入系統指令...</div>

        <canvas id="radarChart"></canvas>

        <div class="result-grid" id="resultGrid" style="display: none;">
            <div class="card">
                <div class="card-label">平均塔血 (守備力)</div>
                <div id="resTower" class="card-value">-</div>
            </div>
            <div class="card">
                <div class="card-label">近期勝率 (侵略性)</div>
                <div id="resWin" class="card-value">-</div>
            </div>
        </div>
    </div>

    <script>
        let chart = null;

        async function startAnalysis() {
            const tag = document.getElementById('playerTag').value.trim();
            const status = document.getElementById('status');
            if (!tag) return alert("請輸入 Tag");

            status.innerText = "📡 正在透過 RoyaleAPI Proxy 擷取數據...";
            status.style.color = "var(--neon-blue)";

            try {
                // Vercel 自動識別 /api/clash-proxy
                const response = await fetch(`/api/clash-proxy?tag=${encodeURIComponent(tag)}`);
                const data = await response.json();

                if (data.error) throw new Error(data.details || data.error);

                displayData(data);
                status.innerText = `✅ 掃描完成: ${data.name}`;
                status.style.color = "#00ff88";
            } catch (err) {
                console.error(err);
                status.innerText = `❌ 錯誤: ${err.message}`;
                status.style.color = "#ff4444";
            }
        }

        function displayData(data) {
            document.getElementById('resultGrid').style.display = 'grid';
            document.getElementById('resTower').innerText = `${data.avgTowerHP} HP`;
            document.getElementById('resWin').innerText = `${data.winRate}%`;

            // 將數據映射至 12D 座標 (指標算法範例)
            const metrics = [
                Math.min(100, (data.avgTowerHP / 8500) * 100), // DEF
                data.winRate,                                 // ATK
                Math.random() * 20 + 70,                      // SKL (範例)
                Math.random() * 50 + 40,                      // CRT
                data.battleCount * 2,                         // END
                (data.avgTowerHP > 4000) ? 90 : 40,           // CLT (抗壓)
                75, 80, 65, 88, 72, 85                        // 預設其他維度
            ];

            updateChart(metrics);
        }

        function updateChart(dataPoints) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['DEF', 'ATK', 'SKL', 'CRT', 'END', 'CLT', 'SPD', 'ACC', 'LUK', 'INT', 'AGI', 'STA'],
                    datasets: [{
                        label: '12D PROFILE',
                        data: dataPoints,
                        backgroundColor: 'rgba(0, 242, 255, 0.15)',
                        borderColor: '#00f2ff',
                        pointBackgroundColor: '#bc13fe',
                        borderWidth: 2
                    }]
                },
                options: {
                    scales: {
                        r: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            angleLines: { color: 'rgba(255,255,255,0.1)' },
                            pointLabels: { color: '#888', font: { size: 10 } },
                            ticks: { display: false, max: 100, min: 0 }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
    </script>
</body>
</html>
