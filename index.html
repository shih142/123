<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMA 12D - ZERO BIAS HUD</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700;900&display=swap');

        :root {
            --cyan: #00f2ff;
            --purple: #bc13fe;
            --red: #ff2a2a;
            --gold: #ffb700;
            --blood: #ff003c;
            --shield: #00ffcc;
            --bg-dark: #05070f;
            --panel-bg: rgba(12, 15, 26, 0.85);
            --disabled: #555555;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px;
        }

        header { text-align: center; margin-bottom: 30px; text-transform: uppercase; }
        h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 3rem; color: #fff; letter-spacing: 6px; text-shadow: 0 0 20px rgba(255,255,255,0.4); margin-bottom: 5px; }
        .sys-status { font-size: 1rem; color: #aaa; letter-spacing: 3px; font-weight: bold; }

        .control-hub {
            background: var(--panel-bg); border: 1px solid rgba(255, 255, 255, 0.2); padding: 20px; border-radius: 12px;
            display: flex; gap: 15px; width: 100%; max-width: 600px; margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        input {
            flex: 1; background: rgba(0,0,0,0.6); border: 1px solid #555; color: #fff;
            padding: 15px; border-radius: 6px; font-family: 'Orbitron', sans-serif; font-size: 1.1rem; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }

        button {
            background: #fff; color: #000; border: none; padding: 0 30px; border-radius: 6px;
            font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        button:hover { background: var(--cyan); box-shadow: 0 0 20px var(--cyan); }

        #alert-box { display: none; width: 100%; max-width: 600px; padding: 15px; background: rgba(255, 42, 42, 0.1); border-left: 5px solid var(--red); color: var(--red); margin-bottom: 20px; font-weight: bold; border-radius: 4px; text-align: center; }

        .dashboard { display: none; width: 100%; max-width: 1100px; gap: 25px; align-items: stretch; animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .panel {
            background: var(--panel-bg); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px;
            padding: 30px; backdrop-filter: blur(10px); box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .side-panel { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .radar-panel { flex: 1.5; display: flex; justify-content: center; align-items: center; position: relative; min-height: 450px; }

        .rating-box {
            background: rgba(0, 0, 0, 0.6); border: 2px solid #555; border-radius: 10px; padding: 20px; text-align: center;
            position: relative; overflow: hidden; transition: border-color 0.5s ease;
        }
        .rating-label { font-size: 1rem; color: #aaa; font-weight: bold; letter-spacing: 2px; }
        .rating-rank { font-family: 'Orbitron', sans-serif; font-size: 4rem; font-weight: 900; line-height: 1.1; margin: 5px 0; transition: color 0.5s ease; }
        .rating-score { font-size: 1.2rem; color: #fff; font-family: 'Orbitron', sans-serif; }
        .score-num { font-weight: bold; }

        .player-header { border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 5px; }
        .player-name { font-size: 2rem; font-family: 'Orbitron', sans-serif; font-weight: bold; color: #fff; text-transform: uppercase; word-break: break-all; }
        .player-tag { color: #888; font-size: 1.1rem; letter-spacing: 2px; }

        .radical-bars { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.1); }
        .bar-container { display: flex; flex-direction: column; gap: 5px; }
        .bar-header { display: flex; justify-content: space-between; align-items: flex-end; }
        .bar-label { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: bold; letter-spacing: 1px; color: #aaa; }
        .bar-val { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 900; color: #fff; }
        .bar-bg { width: 100%; height: 8px; background: #111; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; transition: width 1.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .atk-fill { background: var(--cyan); }
        .def-fill { background: var(--purple); }

        .stat-group { background: rgba(255,255,255,0.02); padding: 12px; border-radius: 8px; border-left: 3px solid #555; }
        .stat-label { font-size: 0.85rem; color: #888; text-transform: uppercase; margin-bottom: 3px; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: #fff; display: flex; align-items: baseline; gap: 5px; }
        .stat-unit { font-size: 0.9rem; color: #888; }
        .decoupled-tag { font-size: 0.65rem; color: #555; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; margin-left: 8px; }

        @media (max-width: 900px) { .dashboard { flex-direction: column; } .radar-panel { min-height: 350px; } }
    </style>
</head>
<body>

    <header>
        <h1>ZERO BIAS HUD</h1>
        <div class="sys-status" id="sys-status">/// OBJECTIVE STATISTICAL MECHANICS ///</div>
    </header>

    <div class="control-hub">
        <input type="text" id="playerTag" placeholder="ENTER PLAYER TAG" autocomplete="off">
        <button onclick="runScan()" id="scanBtn">INITIATE</button>
    </div>

    <div id="alert-box"></div>

    <div class="dashboard" id="dashboard">
        <div class="panel side-panel">
            
            <div class="rating-box" id="rating-container">
                <div class="rating-label">NORMATIVE VECTOR</div>
                <div class="rating-rank" id="ui-rank">--</div>
                <div class="rating-score">EIGENVALUE: <span class="score-num" id="ui-score">0000</span></div>
            </div>

            <div class="player-header">
                <div class="player-tag" id="ui-tag">#TAG</div>
                <div class="player-name" id="ui-name">PLAYER NAME</div>
            </div>

            <div class="radical-bars">
                <div class="bar-container">
                    <div class="bar-header">
                        <div class="bar-label">EXPECTED CROWN YIELD (ATK)</div>
                        <div class="bar-val" id="txt-atk">0</div>
                    </div>
                    <div class="bar-bg"><div class="bar-fill atk-fill" id="bar-atk"></div></div>
                </div>
                <div class="bar-container">
                    <div class="bar-header">
                        <div class="bar-label">RETENTION INDEX (DEF)</div>
                        <div class="bar-val" id="txt-def">0</div>
                    </div>
                    <div class="bar-bg"><div class="bar-fill def-fill" id="bar-def"></div></div>
                </div>
            </div>

            <div class="stat-group" style="margin-top: 15px; opacity: 0.5;">
                <div class="stat-label">OBSERVED WIN RATE <span class="decoupled-tag">EXCLUDED</span></div>
                <div class="stat-value"><span id="ui-win">0</span> <span class="stat-unit">%</span></div>
            </div>
            
            <div class="stat-group">
                <div class="stat-label">PHASE VELOCITY (ELIXIR)</div>
                <div class="stat-value"><span id="ui-elixir">0.0</span> <span class="stat-unit">λ</span></div>
            </div>
        </div>

        <div class="panel radar-panel">
            <canvas id="radarChart"></canvas>
        </div>
    </div>

    <script>
        let myChart = null;

        function showAlert(msg) {
            const box = document.getElementById('alert-box'); box.style.display = 'block'; box.innerText = `[ERROR] ${msg}`;
        }
        function hideAlert() { document.getElementById('alert-box').style.display = 'none'; }

        // 純粹統計學計算
        function getMean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }
        function getStdDev(arr, mean) { return arr.length ? Math.sqrt(arr.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / arr.length) : 0; }
        
        // 絕對物理邊界 [0, 100]，拒絕任何造假的保底分數
        function clamp(val) { return Math.max(0, Math.min(100, val)); }

        // 高斯白噪聲 (用於不可測的變異)
        function boxMuller() {
            let u = 0, v = 0;
            while(u === 0) u = Math.random(); while(v === 0) v = Math.random();
            return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        }

        async function runScan() {
            const tagInput = document.getElementById('playerTag').value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            if (!tagInput) return showAlert("INVALID TAG FORMAT.");

            const btn = document.getElementById('scanBtn');
            hideAlert(); document.getElementById('dashboard').style.display = "none";
            btn.innerText = "CALCULATING..."; btn.style.pointerEvents = "none";

            document.getElementById('bar-atk').style.width = '0%'; document.getElementById('bar-def').style.width = '0%';

            try {
                const targetUrl = new URL('/api/clash-proxy', window.location.origin);
                targetUrl.searchParams.append('tag', tagInput);
                const response = await fetch(targetUrl.toString(), { method: 'GET', headers: { 'Accept': 'application/json' } });
                const data = await response.json();
                if (!response.ok) throw new Error(data.details || data.error || "Connection Failed.");
                updateUI(data);
            } catch (error) {
                showAlert(error.message);
            } finally {
                btn.innerText = "INITIATE"; btn.style.pointerEvents = "auto";
            }
        }

        function updateUI(data) {
            document.getElementById('dashboard').style.display = "flex";
            
            document.getElementById('ui-tag').innerText = `#${data.tag}`;
            document.getElementById('ui-name').innerText = data.name;
            document.getElementById('ui-win').innerText = (data.winRate || 0).toFixed(1);
            document.getElementById('ui-elixir').innerText = data.avgDeckElixir || '0.0';

            // 絕對物理常數定義 (基於遊戲規則)
            const MAX_CROWNS = 3.0;
            const MAX_TOWER_HP = 8500.0;
            const MEDIAN_ELIXIR = 3.0;
            const LOG_CONFIDENCE_MAX = 4.0; // log10(10000 場)

            // 讀取原始數據
            const avgElixir = parseFloat(data.avgDeckElixir) || MEDIAN_ELIXIR; 
            const avgTowerHP = Math.max(1, parseFloat(data.avgTowerHP) || 3000); 
            const hpStdDev = getStdDev(data.hpHistory || [], avgTowerHP);
            const lowHpClutchR = data.lowHpClutchRate || 0; 
            const clutchR = data.clutchRate || 0; 
            const C_earned = parseFloat(data.avgCrownsEarned) || 0;
            const C_lost = parseFloat(data.avgCrownsLost) || 0;
            const r_3C = data.threeCrownRate || 0;
            const N = Math.max(1, data.battleCount || 1);

            // ==========================================
            // 完全客觀的資料科學與物理學公式 (No Magic Numbers)
            // ==========================================

            // 1. ATK (Expected Crown Yield): 絕對期望值，拿多少冠佔滿冠的比例
            const ATK = clamp((C_earned / MAX_CROWNS) * 100);

            // 2. DEF (Retention Index): 資源與皇冠保留率的加權平均
            const hpRatio = avgTowerHP / MAX_TOWER_HP;
            const crownRetainedRatio = 1 - (C_lost / MAX_CROWNS);
            const DEF = clamp(((crownRetainedRatio * 0.6) + (hpRatio * 0.4)) * 100);

            // 3. SKL (Complexity Quotient): 基於雙曲正切將極限操作頻率映射至 [0,1] 區間
            const SKL = clamp(100 * Math.tanh(clutchR + 1.5 * lowHpClutchR));

            // 4. CRT (Critical Strike Ratio): 聖水歸一化的三冠爆擊率
            const CRT = clamp(r_3C * 100 * (MEDIAN_ELIXIR / avgElixir));

            // 5. END (Empirical Confidence): 大數法則下的對數信心水準
            const END = clamp(100 * (Math.log10(N + 1) / LOG_CONFIDENCE_MAX));

            // 6. CLT (Boundary Survival Probability): 殘血存活機率的極限映射
            const CLT = clamp(100 * Math.tanh(3.0 * lowHpClutchR));

            // 7. SPD (Kinematic Cycle Rate): 以 2.8 費為基準的物理轉速平方比
            const SPD = clamp(Math.pow((2.8 / avgElixir), 2) * 40); 

            // 8. ACC (Zero-Sum Efficiency): 納許均衡，淨皇冠數的線性映射 ([-3, 3] -> [0, 100])
            const ACC = clamp(50 + (((C_earned - C_lost) / MAX_CROWNS) * 50));

            // 9. LUK (Stochastic Variance): 真實的標準常態分配誤差 (標準差 5)
            const LUK = clamp(50 + (boxMuller() * 5));

            // 10. STA (Inverse Coefficient of Variation): 絕對客觀統計穩定度 = 1 - 變異係數
            const STA = clamp(100 * (1 - (hpStdDev / avgTowerHP)));

            // 11. AGI (Root Mean Square Vector): 動能維度的均方根 (取代武斷加權)
            const AGI = clamp(Math.sqrt((Math.pow(SPD, 2) + Math.pow(CLT, 2) + Math.pow(ATK, 2)) / 3));

            // 12. INT (Information-Elixir Density): 聖水皇冠轉換效能
            const INT = clamp(100 * Math.tanh(C_earned / avgElixir));

            setTimeout(() => {
                document.getElementById('bar-atk').style.width = `${ATK}%`;
                document.getElementById('bar-def').style.width = `${DEF}%`;
                animateValue("txt-atk", 0, Math.round(ATK), 1500);
                animateValue("txt-def", 0, Math.round(DEF), 1500);
            }, 100);

            const metrics = [DEF, ATK, SKL, CRT, END, CLT, SPD, ACC, LUK, STA, AGI, INT];

            // 歐幾里得範數 (L2 Norm) 計算，滿分理論值為 sqrt(12 * 100^2) ≈ 346.41
            const tensorMagnitude = Math.sqrt(metrics.reduce((acc, val) => acc + Math.pow(val, 2), 0));
            const rawScore = Math.round((tensorMagnitude / 346.41) * 10000); 
            
            // 級距判定
            let rank = 'D'; let rankColor = '#aaa';
            if (rawScore >= 8500) { rank = 'S'; rankColor = '#00f2ff'; } 
            else if (rawScore >= 7000) { rank = 'A'; rankColor = '#00ffcc'; } 
            else if (rawScore >= 5500) { rank = 'B'; rankColor = '#ffb700'; }  
            else if (rawScore >= 4000) { rank = 'C'; rankColor = '#ff2a2a'; }  

            const uiRank = document.getElementById('ui-rank');
            const ratingContainer = document.getElementById('rating-container');
            
            uiRank.innerText = rank;
            uiRank.style.color = rankColor;
            ratingContainer.style.borderColor = rankColor;
            
            animateValue("ui-score", 0, rawScore, 1000);
            drawChart(metrics, rankColor);
        }

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id); let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step); 
            };
            window.requestAnimationFrame(step);
        }

        function drawChart(dataValues, mainColor) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            if (myChart) myChart.destroy(); 
            Chart.defaults.color = '#888'; Chart.defaults.font.family = 'Orbitron';
            myChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['DEF (Retention)', 'ATK (Expected Yield)', 'SKL (Complexity)', 'CRT (Critical Strike)', 'END (Confidence)', 'CLT (Survival)', 'SPD (Kinematics)', 'ACC (Nash Equilibrium)', 'LUK (Variance)', 'STA (Inverse CV)', 'AGI (RMS Vector)', 'INT (Elixir Density)'],
                    datasets: [{
                        label: 'NORMATIVE STATES', data: dataValues,
                        backgroundColor: `${mainColor}20`, borderColor: mainColor, borderWidth: 1.5,
                        pointBackgroundColor: '#fff', pointBorderColor: mainColor, pointRadius: 2, pointHoverRadius: 5
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        r: { angleLines: { color: '#333' }, grid: { color: '#222' }, pointLabels: { color: '#aaa', font: { size: 10 } }, ticks: { display: false, min: 0, max: 100 } }
                    },
                    plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(0,0,0,0.9)', titleColor: mainColor, borderColor: '#555', borderWidth: 1 } }
                }
            });
        }
    </script>
</body>
</html>
