<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMA 12D - OVERCLOCKED TACTICAL HUD</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700;900&display=swap');

        :root {
            --cyan: #00f2ff;
            --purple: #bc13fe;
            --red: #ff003c;
            --gold: #ffb700;
            --blood: #ff0000;
            --shield: #00ffaa;
            --bg-dark: #030005;
            --panel-bg: rgba(15, 5, 10, 0.9);
            --disabled: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(255, 0, 60, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 60, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px;
            overflow-x: hidden;
        }

        header { text-align: center; margin-bottom: 30px; text-transform: uppercase; animation: glitch 2s infinite; }
        h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 3.5rem; color: var(--red); letter-spacing: 8px; text-shadow: 0 0 30px rgba(255,0,60,0.8); margin-bottom: 5px; }
        .sys-status { font-size: 1.2rem; color: var(--gold); letter-spacing: 5px; font-weight: 900; }

        @keyframes glitch {
            0% { text-shadow: 2px 0 var(--cyan), -2px 0 var(--purple); }
            50% { text-shadow: -2px 0 var(--cyan), 2px 0 var(--purple); }
            100% { text-shadow: 2px 0 var(--cyan), -2px 0 var(--purple); }
        }

        .control-hub {
            background: var(--panel-bg); border: 2px solid var(--red); padding: 20px; border-radius: 12px;
            display: flex; gap: 15px; width: 100%; max-width: 600px; margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(255,0,60,0.4), inset 0 0 20px rgba(255,0,60,0.1);
        }

        input {
            flex: 1; background: rgba(0,0,0,0.8); border: 1px solid var(--red); color: #fff;
            padding: 15px; border-radius: 6px; font-family: 'Orbitron', sans-serif; font-size: 1.2rem; outline: none; transition: 0.3s;
        }
        input:focus { box-shadow: 0 0 20px rgba(255, 0, 60, 0.6); }

        button {
            background: var(--red); color: #fff; border: none; padding: 0 30px; border-radius: 6px;
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.2rem; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 2px;
        }
        button:hover { background: #fff; color: var(--red); box-shadow: 0 0 30px #fff; transform: scale(1.05); }

        #alert-box { display: none; width: 100%; max-width: 600px; padding: 15px; background: rgba(255, 0, 0, 0.2); border-left: 5px solid #fff; color: #fff; margin-bottom: 20px; font-weight: bold; border-radius: 4px; text-align: center; text-shadow: 0 0 10px red; }

        .dashboard { display: none; width: 100%; max-width: 1100px; gap: 25px; align-items: stretch; animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .panel {
            background: var(--panel-bg); border: 1px solid rgba(255, 0, 60, 0.3); border-radius: 15px;
            padding: 30px; box-shadow: inset 0 0 30px rgba(0,0,0,0.8); position: relative; overflow: hidden;
        }
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: linear-gradient(90deg, transparent, var(--red), transparent);
        }

        .side-panel { flex: 1; display: flex; flex-direction: column; gap: 20px; z-index: 1; }
        .radar-panel { flex: 1.5; display: flex; justify-content: center; align-items: center; position: relative; min-height: 450px; }

        .rating-box {
            background: rgba(0, 0, 0, 0.8); border: 3px solid var(--red); border-radius: 10px; padding: 20px; text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.3), inset 0 0 20px rgba(255, 0, 60, 0.2);
            position: relative; transition: all 0.3s ease;
        }
        .rating-label { font-size: 1.2rem; color: var(--red); font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 10px var(--red); }
        .rating-rank { font-family: 'Orbitron', sans-serif; font-size: 4.5rem; font-weight: 900; line-height: 1.1; margin: 10px 0; transition: color 0.5s ease; text-shadow: 0 0 20px currentColor; }
        .rating-score { font-size: 1.2rem; color: #fff; font-family: 'Orbitron', sans-serif; }
        .score-num { font-weight: bold; color: var(--gold); }

        .player-header { border-bottom: 2px dashed var(--red); padding-bottom: 10px; margin-bottom: 5px; }
        .player-name { font-size: 2.2rem; font-family: 'Orbitron', sans-serif; font-weight: 900; color: #fff; text-transform: uppercase; word-break: break-all; }
        .player-tag { color: var(--red); font-size: 1.2rem; letter-spacing: 3px; font-weight: bold; }

        .radical-bars { display: flex; flex-direction: column; gap: 20px; margin-top: 15px; padding-top: 20px; border-top: 1px solid rgba(255,0,60,0.2); }
        .bar-container { display: flex; flex-direction: column; gap: 5px; }
        .bar-header { display: flex; justify-content: space-between; align-items: flex-end; }
        .bar-label { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 900; letter-spacing: 2px; }
        .atk-label { color: var(--blood); text-shadow: 0 0 10px red; }
        .def-label { color: var(--shield); text-shadow: 0 0 10px var(--shield); }
        .bar-val { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900; }
        .bar-bg { width: 100%; height: 16px; background: #000; border: 1px solid #333; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 10px rgba(255,255,255,0.1); }
        .bar-fill { height: 100%; width: 0%; transition: width 0.8s cubic-bezier(0.1, 1, 0.1, 1); }
        .atk-fill { background: linear-gradient(90deg, #400, var(--blood), #f00); box-shadow: 0 0 15px var(--blood); }
        .def-fill { background: linear-gradient(90deg, #022, var(--shield), #0ff); box-shadow: 0 0 15px var(--shield); }

        .stat-group { background: rgba(255,0,60,0.05); padding: 15px; border-radius: 8px; border-left: 4px solid var(--red); }
        .stat-label { font-size: 0.9rem; color: #aaa; text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
        .stat-value { font-size: 2rem; font-weight: 900; color: #fff; display: flex; align-items: baseline; gap: 5px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .stat-unit { font-size: 1rem; color: var(--red); }

        @media (max-width: 900px) { .dashboard { flex-direction: column; } .radar-panel { min-height: 400px; } }
    </style>
</head>
<body>

    <header>
        <h1>OVERCLOCKED HUD</h1>
        <div class="sys-status" id="sys-status">/// EXTREME POLARIZATION ENGINE ///</div>
    </header>

    <div class="control-hub">
        <input type="text" id="playerTag" placeholder="ENTER PLAYER TAG FOR ANNIHILATION" autocomplete="off">
        <button onclick="runScan()" id="scanBtn">EXECUTE</button>
    </div>

    <div id="alert-box"></div>

    <div class="dashboard" id="dashboard">
        <div class="panel side-panel">
            
            <div class="rating-box" id="rating-container">
                <div class="rating-label">TYRANT CLASSIFICATION</div>
                <div class="rating-rank" id="ui-rank">--</div>
                <div class="rating-score">THREAT LEVEL: <span class="score-num" id="ui-score">0000</span></div>
            </div>

            <div class="player-header">
                <div class="player-tag" id="ui-tag">#TAG</div>
                <div class="player-name" id="ui-name">PLAYER NAME</div>
            </div>

            <div class="radical-bars">
                <div class="bar-container">
                    <div class="bar-header">
                        <div class="bar-label atk-label">SUPERNOVA IGNITION (ATK)</div>
                        <div class="bar-val" style="color: var(--blood);" id="txt-atk">0</div>
                    </div>
                    <div class="bar-bg"><div class="bar-fill atk-fill" id="bar-atk"></div></div>
                </div>
                <div class="bar-container">
                    <div class="bar-header">
                        <div class="bar-label def-label">QUANTUM COLLAPSE (DEF)</div>
                        <div class="bar-val" style="color: var(--shield);" id="txt-def">0</div>
                    </div>
                    <div class="bar-bg"><div class="bar-fill def-fill" id="bar-def"></div></div>
                </div>
            </div>
            
            <div class="stat-group" style="margin-top: 15px;">
                <div class="stat-label">PHASE VELOCITY (ELIXIR)</div>
                <div class="stat-value"><span id="ui-elixir">0.0</span> <span class="stat-unit">λ</span></div>
            </div>
        </div>

        <div class="panel radar-panel">
            <canvas id="radarChart"></canvas>
        </div>
    </div>

    <script>
        let myChart = null;

        function showAlert(msg) {
            const box = document.getElementById('alert-box'); box.style.display = 'block'; box.innerText = `[CRITICAL FAILURE] ${msg}`;
        }
        function hideAlert() { document.getElementById('alert-box').style.display = 'none'; }

        // 徹底拔除底線，最低分就是 0，絕不寬容
        function clamp(val) { return Math.max(0, Math.min(100, val)); }

        // 標準差計算
        function getStdDev(arr, mean) { return arr.length ? Math.sqrt(arr.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / arr.length) : 0; }

        async function runScan() {
            const tagInput = document.getElementById('playerTag').value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            if (!tagInput) return showAlert("INVALID TAG FORMAT.");

            const btn = document.getElementById('scanBtn');
            hideAlert(); document.getElementById('dashboard').style.display = "none";
            btn.innerText = "OVERCLOCKING..."; btn.style.pointerEvents = "none";

            document.getElementById('bar-atk').style.width = '0%'; document.getElementById('bar-def').style.width = '0%';

            try {
                const targetUrl = new URL('/api/clash-proxy', window.location.origin);
                targetUrl.searchParams.append('tag', tagInput);
                const response = await fetch(targetUrl.toString(), { method: 'GET', headers: { 'Accept': 'application/json' } });
                const data = await response.json();
                if (!response.ok) throw new Error(data.details || data.error || "Connection Terminated.");
                updateUI(data);
            } catch (error) {
                showAlert(error.message);
            } finally {
                btn.innerText = "EXECUTE"; btn.style.pointerEvents = "auto";
            }
        }

        function updateUI(data) {
            document.getElementById('dashboard').style.display = "flex";
            
            document.getElementById('ui-tag').innerText = `#${data.tag}`;
            document.getElementById('ui-name').innerText = data.name;
            document.getElementById('ui-elixir').innerText = data.avgDeckElixir || '0.0';

            const avgElixir = parseFloat(data.avgDeckElixir) || 3.0; 
            const avgTowerHP = Math.max(1, parseFloat(data.avgTowerHP) || 3000); 
            const hpStdDev = getStdDev(data.hpHistory || [], avgTowerHP);
            const lowHpClutchR = data.lowHpClutchRate || 0; 
            const clutchR = data.clutchRate || 0; 
            const C_earned = parseFloat(data.avgCrownsEarned) || 0;
            const C_lost = parseFloat(data.avgCrownsLost) || 0;
            const r_3C = data.threeCrownRate || 0;
            const N = Math.max(1, data.battleCount || 1);
            const hpRatio = avgTowerHP / 8500.0;

            // ==========================================
            // 超激進絞肉機演算法 (Extreme Polarization Mechanics)
            // ==========================================

            // 1. ATK (Supernova Ignition): 四次方指數爆發。拿不到 1.5 冠就是廢物，超過 2.2 冠直接封神。
            const ATK = clamp((100 * Math.pow(C_earned / 2.2, 4)) + (r_3C * 100));

            // 2. DEF (Quantum Collapse): 血量四次方極化，且只要掉 1 冠，防禦分數以 e^-3.0 (降至約 4.9%) 崩塌。
            const DEF = clamp(100 * Math.pow(hpRatio, 4) * Math.exp(-3.0 * C_lost));

            // 其餘指標也配合極端化
            const SKL = clamp(100 * Math.pow(clutchR + lowHpClutchR * 2, 2)); // 技巧雙倍放大平方
            const CRT = clamp(r_3C * 150 * (3.0 / avgElixir)); // 暴擊率溢出設計
            const END = clamp(100 * (Math.log10(N + 1) / 3.0)); 
            const CLT = clamp(100 * Math.pow(lowHpClutchR * 4.0, 3)); // 殘血求生率三次方
            const SPD = clamp(Math.pow((2.6 / avgElixir), 3) * 50); // 越低費越像瘋狗
            
            // ACC 納許均衡：直接懲罰負冠數
            const netCrowns = C_earned - C_lost;
            const ACC = clamp(netCrowns < 0 ? 0 : (netCrowns * 50)); 

            // STA 穩定度：嚴格的指數衰減
            const STA = clamp(100 * Math.exp(-5.0 * (hpStdDev / avgTowerHP)));
            
            // AGI 動能爆發：乘法聯動，缺一不可
            const AGI = clamp((SPD * CLT * ATK) / 10000);
            
            // INT 戰場決斷
            const INT = clamp(100 * Math.pow(C_earned / avgElixir, 2));
            
            // LUK 隨機雜訊
            const LUK = clamp(Math.random() * 100);

            setTimeout(() => {
                document.getElementById('bar-atk').style.width = `${ATK}%`;
                document.getElementById('bar-def').style.width = `${DEF}%`;
                animateValue("txt-atk", 0, Math.round(ATK), 800);
                animateValue("txt-def", 0, Math.round(DEF), 800);
            }, 100);

            const metrics = [DEF, ATK, SKL, CRT, END, CLT, SPD, ACC, LUK, STA, AGI, INT];

            // 總分計算：不再客氣，低分段直接輾平
            const tensorMagnitude = Math.sqrt(metrics.reduce((acc, val) => acc + Math.pow(val, 2), 0));
            const rawScore = Math.round((tensorMagnitude / 346.41) * 10000); 
            
            // 級別判定 (超高標準)
            let rank = 'TRASH'; let rankColor = '#333';
            if (rawScore >= 9000) { rank = 'GOD (神)'; rankColor = '#fff'; } 
            else if (rawScore >= 7500) { rank = 'TYRANT (暴君)'; rankColor = '#ff003c'; } 
            else if (rawScore >= 5000) { rank = 'ELITE (菁英)'; rankColor = '#bc13fe'; }  
            else if (rawScore >= 2500) { rank = 'PREY (獵物)'; rankColor = '#ffb700'; }  

            const uiRank = document.getElementById('ui-rank');
            const ratingContainer = document.getElementById('rating-container');
            
            uiRank.innerText = rank;
            uiRank.style.color = rankColor;
            ratingContainer.style.borderColor = rankColor;
            
            animateValue("ui-score", 0, rawScore, 1000);
            drawChart(metrics, rankColor);
        }

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id); let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step); 
            };
            window.requestAnimationFrame(step);
        }

        function drawChart(dataValues, mainColor) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            if (myChart) myChart.destroy(); 
            Chart.defaults.color = '#888'; Chart.defaults.font.family = 'Orbitron';
            myChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['DEF (Collapse)', 'ATK (Supernova)', 'SKL (Execution)', 'CRT (Overkill)', 'END (Tenacity)', 'CLT (Miracle)', 'SPD (Frenzy)', 'ACC (Domination)', 'LUK (Chaos)', 'STA (Ironclad)', 'AGI (Momentum)', 'INT (Tactics)'],
                    datasets: [{
                        label: 'THREAT LEVEL', data: dataValues,
                        backgroundColor: `${mainColor}40`, borderColor: mainColor, borderWidth: 3,
                        pointBackgroundColor: '#000', pointBorderColor: mainColor, pointRadius: 4, pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        r: { angleLines: { color: 'rgba(255,0,60,0.3)', lineWidth: 1 }, grid: { color: 'rgba(255,0,60,0.2)' }, pointLabels: { color: '#fff', font: { size: 11, weight: 'bold' } }, ticks: { display: false, min: 0, max: 100 } }
                    },
                    plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(255,0,60,0.9)', titleColor: '#fff', bodyColor: '#fff', borderColor: '#fff', borderWidth: 1 } }
                }
            });
        }
    </script>
</body>
</html>
