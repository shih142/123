<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEURISTIC-X v14.7 | Advanced Analytics</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --neon-green: #00ff88;
            --neon-blue: #00d4ff;
            --danger: #ff4466;
            --glass: rgba(255, 255, 255, 0.05);
            --bg: #0a0a0c;
        }

        body {
            background: var(--bg);
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 磨砂玻璃背景裝飾 */
        body::before {
            content: "";
            position: fixed;
            top: -10%; left: -10%;
            width: 40%; height: 40%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.1) 0%, transparent 70%);
            z-index: -1;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; color: var(--neon-green); }

        .btn-sync {
            background: linear-gradient(45deg, var(--neon-green), var(--neon-blue));
            border: none; color: #000; padding: 12px 24px;
            border-radius: 8px; cursor: pointer; font-weight: bold;
            transition: 0.3s; box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .btn-sync:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 255, 136, 0.5); }

        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }

        .card {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .stat-val { font-size: 2rem; font-weight: bold; color: #fff; margin: 5px 0; }
        .stat-label { color: #888; font-size: 0.8rem; text-transform: uppercase; }

        #deckGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .card-img { width: 100%; border-radius: 5px; border: 1px solid #444; }

        .battle-log { grid-column: span 2; max-height: 500px; overflow-y: auto; }
        .log-entry {
            display: grid; grid-template-columns: 80px 1fr 100px 80px;
            align-items: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .win { color: var(--neon-green); font-weight: bold; }
        .loss { color: var(--danger); font-weight: bold; }

        #toast {
            position: fixed; top: 20px; right: 20px; padding: 15px 30px;
            background: #fff; color: #000; border-radius: 10px; font-weight: bold;
            display: none; animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">HEURISTIC-X <span style="color:#fff">14.7</span></div>
        <button class="btn-sync" onclick="fetchAndRenderData()">LIVE SYNC REAL-TIME API</button>
    </header>

    <div class="grid">
        <div class="card">
            <div class="stat-label">Current Trophies</div>
            <div id="trophies" class="stat-val">----</div>
            <div class="stat-label" style="margin-top:15px">Recent Win Rate</div>
            <div id="winRate" class="stat-val" style="color:var(--neon-blue)">--%</div>
        </div>

        <div class="card">
            <div class="stat-label">Current Battle Deck</div>
            <div id="deckGrid">
                </div>
        </div>

        <div class="card">
            <canvas id="radarChart"></canvas>
        </div>

        <div class="card" style="grid-column: span 1;">
            <div class="stat-label">Elixir Efficiency Trend</div>
            <canvas id="trendChart" style="margin-top:10px"></canvas>
        </div>

        <div class="card battle-log">
            <div class="stat-label" style="margin-bottom:15px">Operational Battle History</div>
            <div id="logContent">
                <p style="color:#666">等待數據注入...</p>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    let trendChart, radarChart;

    // 初始化圖表
    function initCharts() {
        const tCtx = document.getElementById('trendChart').getContext('2d');
        trendChart = new Chart(tCtx, {
            type: 'line',
            data: {
                labels: Array(10).fill(''),
                datasets: [{
                    label: 'Efficiency',
                    borderColor: '#00d4ff',
                    data: Array(10).fill(0),
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(0, 212, 255, 0.1)'
                }]
            },
            options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { display: false } } }
        });

        const rCtx = document.getElementById('radarChart').getContext('2d');
        radarChart = new Chart(rCtx, {
            type: 'radar',
            data: {
                labels: ['Attack', 'Defense', 'Cycle', 'Elixir', 'Versatility'],
                datasets: [{
                    label: 'Player Profile',
                    data: [0,0,0,0,0],
                    backgroundColor: 'rgba(0, 255, 136, 0.2)',
                    borderColor: '#00ff88',
                    pointBackgroundColor: '#00ff88'
                }]
            },
            options: { 
                scales: { r: { grid: { color: '#333' }, angleLines: { color: '#333' }, ticks: { display: false }, min: 0, max: 100 } },
                plugins: { legend: { display: false } }
            }
        });
    }

    async function fetchAndRenderData() {
        const playerTag = "#CV9QU9CYJ";
        const proxy = "/api/clash-proxy";

        try {
            const res = await fetch(`${proxy}?tag=${encodeURIComponent(playerTag)}`);
            const data = await res.json();
            console.log("Data Received:", data);

            // 1. 更新基本數據
            document.getElementById('trophies').innerText = data.trophies.toLocaleString();
            
            // 2. 更新卡組
            const deckGrid = document.getElementById('deckGrid');
            deckGrid.innerHTML = data.currentDeck.map(card => 
                `<img src="${card.iconUrls.medium}" class="card-img" title="${card.name}">`
            ).join('');

            // 3. 處理戰鬥紀錄
            if (data.battleLog) {
                renderAdvancedLog(data.battleLog);
                updateAdvancedCharts(data.battleLog);
            }

            showToast("DATA SYNC COMPLETED");
        } catch (err) {
            console.error(err);
            showToast("SYNC ERROR");
        }
    }

    function renderAdvancedLog(logs) {
        const container = document.getElementById('logContent');
        let wins = 0;
        
        container.innerHTML = logs.slice(0, 10).map(log => {
            const isWin = log.team[0].crowns > log.opponent[0].crowns;
            if (isWin) wins++;
            return `
                <div class="log-entry">
                    <span class="${isWin ? 'win' : 'loss'}">${isWin ? 'WIN' : 'LOSS'}</span>
                    <span>${log.type.replace(/([A-Z])/g, ' $1')}</span>
                    <span style="text-align:right">👑 ${log.team[0].crowns} - ${log.opponent[0].crowns}</span>
                    <span style="color:#666; font-size:0.7rem; text-align:right">NEW</span>
                </div>
            `;
        }).join('');

        document.getElementById('winRate').innerText = (wins / 10 * 100) + "%";
    }

    function updateAdvancedCharts(logs) {
        // 更新趨勢圖
        const crownDiffs = logs.slice(0, 10).map(l => l.team[0].crowns - l.opponent[0].crowns).reverse();
        trendChart.data.datasets[0].data = crownDiffs;
        trendChart.update();

        // 模擬雷達數據（根據實戰結果計算）
        const avgCrowns = logs.reduce((a, b) => a + b.team[0].crowns, 0) / logs.length;
        radarChart.data.datasets[0].data = [
            avgCrowns * 30, // Attack
            (3 - avgCrowns) * 30, // Defense
            Math.random() * 40 + 50, // Cycle (randomized for demo)
            70, // Elixir
            85  // Versatility
        ];
        radarChart.update();
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    window.onload = initCharts;
</script>

</body>
</html>
