<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MAXIMA 12D SCANNER</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0a0b10; color: #00f2ff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        .box { background: #161822; padding: 30px; border-radius: 15px; border: 1px solid #00f2ff; width: 400px; text-align: center; }
        input { background: #000; border: 1px solid #00f2ff; color: #fff; padding: 10px; width: 60%; border-radius: 5px; }
        button { background: #00f2ff; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-left: 5px; border-radius: 5px; }
        #status { margin: 15px 0; font-size: 0.8rem; color: #888; }
        canvas { margin-top: 20px; }
    </style>
</head>
<body>

<div class="box">
    <h2>MAXIMA 12D</h2>
    <input type="text" id="tag" placeholder="#P8RR2P">
    <button onclick="scan()">SCAN</button>
    <div id="status">系統就緒</div>
    <canvas id="radar"></canvas>
</div>

<script>
    let chart;
    async function scan() {
        const tag = document.getElementById('tag').value.trim();
        const status = document.getElementById('status');
        if(!tag) return;

        status.innerText = "📡 正在連線數據中心...";
        
        try {
            // 重要：使用 URLSearchParams 或手動確保參數不含特殊字元造成的 Pattern 錯誤
            const queryTag = tag.replace('#', '');
            const res = await fetch(`/api/clash-proxy?tag=${encodeURIComponent(queryTag)}`);
            const data = await res.json();

            if(!res.ok) throw new Error(data.message || "請求失敗");

            status.innerText = `✅ 玩家: ${data.name} (平均塔血: ${data.avgTowerHP})`;
            updateChart([
                (data.avgTowerHP/8000)*100, data.winRate, 85, 70, 60, 90, 75, 80, 65, 88, 70, 85
            ]);
        } catch (e) {
            status.innerText = `❌ 錯誤: ${e.message}`;
            console.error(e);
        }
    }

    function updateChart(vals) {
        const ctx = document.getElementById('radar');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['DEF', 'ATK', 'SKL', 'CRT', 'END', 'CLT', 'SPD', 'ACC', 'LUK', 'INT', 'AGI', 'STA'],
                datasets: [{ data: vals, borderColor: '#00f2ff', backgroundColor: 'rgba(0,242,255,0.2)' }]
            },
            options: { plugins: { legend: { display: false } }, scales: { r: { grid: { color: '#333' }, ticks: { display: false }, suggestedMax: 100 } } }
        });
    }
</script>
</body>
</html>
