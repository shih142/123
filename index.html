<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMA 12D - 戰術雷達掃描</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --neon: #00f2ff; --bg: #0a0b10; --purple: #bc13fe; }
        body {
            background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; padding: 50px 20px; margin: 0;
        }
        .container {
            background: linear-gradient(145deg, #161822, #0d0e14);
            padding: 40px; border-radius: 20px; border: 1px solid var(--neon);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.15); text-align: center; max-width: 550px; width: 100%;
        }
        h1 { color: var(--neon); letter-spacing: 4px; margin: 0 0 5px 0; font-size: 2.2rem; }
        .subtitle { color: var(--purple); font-size: 0.85rem; margin-bottom: 30px; letter-spacing: 2px; }
        
        .search-box { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        input {
            background: rgba(0, 0, 0, 0.5); border: 1px solid var(--neon); color: #fff;
            padding: 12px 15px; border-radius: 8px; width: 60%; outline: none; font-size: 1rem;
            transition: box-shadow 0.3s;
        }
        input:focus { box-shadow: 0 0 10px rgba(0, 242, 255, 0.3); }
        button {
            background: var(--neon); color: #000; border: none; padding: 12px 25px;
            border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s;
        }
        button:hover { box-shadow: 0 0 20px var(--neon); transform: translateY(-2px); }
        
        #status { font-size: 0.9rem; color: #888; min-height: 20px; margin-bottom: 20px; }
        
        .data-cards { display: none; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px; border-bottom: 3px solid var(--purple); }
        .card-label { font-size: 0.75rem; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }
        .card-value { font-size: 1.8rem; font-weight: bold; color: var(--neon); }
        
        canvas { max-width: 100%; height: auto; }
    </style>
</head>
<body>

    <div class="container">
        <h1>MAXIMA 12D</h1>
        <div class="subtitle">TACTICAL INTELLIGENCE SCANNER</div>

        <div class="search-box">
            <input type="text" id="playerTag" placeholder="輸入玩家 Tag (如 P8RR2P)">
            <button onclick="runScan()">SCAN</button>
        </div>
        
        <div id="status">系統就緒，等待指令輸入...</div>

        <div class="data-cards" id="dataCards">
            <div class="card">
                <div class="card-label">Avg Tower HP</div>
                <div class="card-value" id="avgHpVal">-</div>
            </div>
            <div class="card">
                <div class="card-label">Recent Win Rate</div>
                <div class="card-value" id="winRateVal">-</div>
            </div>
        </div>

        <canvas id="radarChart"></canvas>
    </div>

    <script>
        let radarChart = null;

        async function runScan() {
            const tagInput = document.getElementById('playerTag').value;
            const status = document.getElementById('status');
            const dataCards = document.getElementById('dataCards');
            
            // 1. 徹底過濾：只保留英數字，防止各種 Pattern Error
            const cleanTag = tagInput.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            if (!cleanTag) {
                status.innerText = "❌ 請輸入有效的玩家 Tag";
                status.style.color = "#ff4444";
                return;
            }

            status.innerText = "📡 正在與 API 節點同步數據...";
            status.style.color = "var(--neon)";
            dataCards.style.display = "none";

            try {
                // 2. 嚴格構造 URL：這能 100% 避免瀏覽器拋出字串不符的錯誤
                const targetUrl = new URL('/api/clash-proxy', window.location.origin);
                targetUrl.searchParams.append('tag', cleanTag);

                const response = await fetch(targetUrl.toString(), {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.details || data.error || "伺服器無回應");
                }

                // 3. UI 數據更新
                status.innerText = `✅ 玩家已鎖定：${data.name}`;
                status.style.color = "#00ff88";
                
                document.getElementById('avgHpVal').innerText = data.avgTowerHP;
                document.getElementById('winRateVal').innerText = data.winRate + '%';
                dataCards.style.display = "grid";

                // 4. 動態計算 12D 雷達數值
                const defScore = Math.min(100, (data.avgTowerHP / 8500) * 100);
                const atkScore = data.winRate;
                const baseData = [defScore, atkScore, 85, 75, 60, 90, 70, 82, 65, 88, 72, 85];
                
                drawChart(baseData);

            } catch (error) {
                console.error("Fetch Exception:", error);
                status.innerText = `❌ 掃描失敗: ${error.message}`;
                status.style.color = "#ff4444";
            }
        }

        function drawChart(dataValues) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            if (radarChart) radarChart.destroy();
            
            radarChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['DEF', 'ATK', 'SKL', 'CRT', 'END', 'CLT', 'SPD', 'ACC', 'LUK', 'INT', 'AGI', 'STA'],
                    datasets: [{
                        label: 'PROFILE DATA',
                        data: dataValues,
                        backgroundColor: 'rgba(0, 242, 255, 0.15)',
                        borderColor: '#00f2ff',
                        borderWidth: 2,
                        pointBackgroundColor: '#bc13fe',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: '#bc13fe',
                        pointRadius: 4
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.15)' },
                            grid: { color: 'rgba(255, 255, 255, 0.15)' },
                            pointLabels: { color: '#ccc', font: { size: 11, family: 'sans-serif' } },
                            ticks: { display: false, min: 0, max: 100 }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
    </script>
</body>
</html>
